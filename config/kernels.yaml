# Kernels SPICE usados pelo projeto. Baixados e conferidos por tools/fetch_kernels.py.
# Fontes: ver docs/fontes.md [F1] (DE440, versão curta de440s) e [F2] (naif0012.tls).
diretorio: data/kernels
kernels:
  - arquivo: naif0012.tls
    url: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
    # O NAIF não publica checksum para o diretório lsk/. MD5 calculado localmente
    # no download de 2026-10-26; serve só para detectar mudança do arquivo.
    md5: 25a2fff30b0dedb4d76c06727b1895b1
    md5_fonte: calculado localmente
  # de440s.bsp: mesma solução DE440, intervalo reduzido 1849–2150 (ADR 0002).
  - arquivo: de440s.bsp
    url: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
    # MD5 publicado pelo NAIF em spk/planets/aa_checksums.txt (conferido em 2026-10-26).
    md5: 3917ee56769db332790c751e2168843d
    md5_fonte: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/aa_checksums.txt
  # pck00011.tpc: orientação de Marte (polo e meridiano, IAU WGCCRE 2015) para o frame IAU_MARS (Etapa 3.3,
  # declinação das assíntotas). Mesmo arquivo da [F17]; o NAIF não publica checksum para pck/.
  - arquivo: pck00011.tpc
    url: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
    md5: 3c0bdc01bb4101d6242cf96ece67a586
    md5_fonte: calculado localmente (o mesmo registrado em docs/fontes.md, F17)
