  # MAV sólido do MSR, estimativa de projeto conceitual ([F269] PDF p. 2, Tab. 1, coluna MAV), kg: estágio 1 = "Stage k-1",
  # estágio 2 = "Stage k".
  msr:
    inerte_motor_kg: {valor: [46, 14], fonte: "[F269] PDF p. 2, Tab. 1: \"Stage k-1 ... Non-prop inerts kg 14 / inert kg 46 / propellant kg 216\"; \"Stage k ... Non-prop inerts kg 34 / inert kg 14 / propellant kg 54\""}
    inerte_nao_propulsivo_kg: {valor: [14, 34], fonte: "[F269] PDF p. 2, Tab. 1 (mesma citação)"}
    propelente_kg: {valor: [216, 54], fonte: "[F269] PDF p. 2, Tab. 1 (mesma citação)"}
  altitude_km: {valor: 380, fonte: "decisão do Fabio, 2026-11-10 (PR #60, item 4): o caso com margem a 380 km"}
  # Decisão do Fabio, 2026-11-10 (portão da lei de inerte): P-113 aprovada como NÃO VALIDADA; variante A nominal, B sensibilidade.
  variante_nominal: A
  # Viés do modelo de subida do sólido (P-114): o menor fator comum no Isp dos dois estágios que leva o MSR da variante A à
  # órbita publicada (varredura até o primeiro que fecha, depois bisseção na borda de baixo da janela).
  vies:
    fator_isp_busca: {valor: [1.0, 1.2], premissa: P-114}
    passo_varredura: {valor: 0.005, premissa: P-114}
    passos_bissecao: {valor: 20, premissa: P-114}
  # Gasto do excesso (P-115): (a1) ignição antecipada do estágio 2, o método do MSR ([F230] PDF p. 9; NTRS 20200002335 PDF p. 3),
  # com o limite da antecedência alargado só neste caso; (a2) guinada alternada do estágio 2 (4º parâmetro do guiamento, rad).
  antecedencia_max_s: {valor: 300, premissa: P-115}
  guinada:
    partida_rad: {valor: 0.3, premissa: P-115}
    limites_rad: {valor: [0.0, 1.4], premissa: P-115}
  semieixo_max_alt_km: {valor: 500, fonte: "[F273] PDF p. 1: \"3. Semi-major axis below 500-km altitude to reduce size of orbit dispersion and ensure reliable imaging opportunities by ERO.\""}
  raio_equatorial_f273_km: {valor: 3396.2, fonte: "[F273] PDF p. 1: \"the semi-major axis (SMA) altitudes are defined relative to Mars's equatorial radius of 3396.2\""}
  propulsor_orbitador: {valor: XIPS-25, referencia: "results/familia1/missao.md (o orbitador elétrico da família 1: XIPS-25, o primeiro que fecha); calculado, não verificado"}
