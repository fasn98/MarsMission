termico:
  rhu_w_2014: {valor: 0.90, fonte: "[F155] p. 1: \"As of September 2014, the average thermal power of the RHUs in the DOE's inventory was approximately 0.90 watts each\""}
  rhu_queda_w_ano: {valor: 0.01, fonte: "[F155] p. 1: \"this thermal power will continue to decrease by about one-hundreth of a watt per year\""}
  rhu_ano_referencia: {valor: 2014, fonte: "[F155] p. 1: \"As of September 2014\""}
  rhu_teto_new_frontiers: {valor: 43, fonte: "[F155] p. 2: \"Proposing teams have been offered the chance to use up to 43 RHUs from the existing U.S. inventory\" (teto oferecido ao edital do New Frontiers, não o tamanho do inventário)"}
  envelhecimento_solido:
    - "[F263] PDF p. 1: \"The test plan includes propellant aging first at high vacuum conditions, representative of the Mars transit, followed by an additional year at simulated Mars surface conditions.\""
    - "[F263] PDF p. 2: \"The project has also completed the first of three phases of propellant aging\""
    - "[F263] PDF p. 1: \"the flight heritage is limited and outside the environments, the MAV must endure\""
    - "[F250] PDF p. 2: \"concerns exist with long duration aging associated with baseline CTPB (cold temperature capable) propellant\""
    - "[F248] PDF p. 3: \"The SRL is expected to keep the MAV between -40 °C and +40 °C, enabling the use of propellant that has already been qualified for that temperature range.\""
    - "[F248] PDF p. 13: \"Current qualification minimum temperatures are -50 °C\"; PDF p. 14: \"Data from the analog samples showed cracking at approximately -70 °C\""
  tempo_no_msr:
    - "[F266] (slides do IAC-19) PDF p. 3: \"MAV dwell time in SRL on Mars ~9 months\""
    - "[F35] PDF p. 1: \"After residing on the surface for another year\""

ruido_subida:   # Fabio, 2026-11-11: diagnóstico do piso de ruído dos integradores da subida (P-116), sem mudar resultados
  solido:   # rtol, atol (SI), passo máximo nas queimas e na costa (s); "atual" é o padrão de orbital.subida.voa_solido
    integradores: {valor: {atual: [1.0e-9, 1.0e-6, 1.0, 5.0], a: [1.0e-10, 1.0e-7, 0.5, 2.5], b: [1.0e-11, 1.0e-8, 0.25, 1.0], c: [1.0e-12, 1.0e-9, 0.1, 0.5]}, premissa: P-116}
    referencia: {valor: [1.0e-13, 1.0e-10, 0.05, 0.25], premissa: P-116}
  hipergolico:   # rtol, atol, passo máximo (s); "atual" é o da P-107
    integradores: {valor: {atual: [1.0e-8, 1.0e-6, 2.0], a: [1.0e-10, 1.0e-8, 1.0], b: [1.0e-11, 1.0e-9, 0.5], c: [1.0e-12, 1.0e-10, 0.25]}, premissa: P-116}
    referencia: {valor: [1.0e-13, 1.0e-11, 0.1], premissa: P-116}
  rugosidade: {valor: {passos: 21, delta_t_antes_s: 1.0e-4, delta_theta0_rad: 1.0e-7}, premissa: P-116}
  escalas_custo: {valor: [0.97, 0.98, 0.99, 1.0, 1.02, 1.03], premissa: P-116}   # P-111 a 380 km, onde o CI divergiu
  # Reprodutibilidade (item 1c): a escala mínima do sólido (P-117) com o rtol e o atol multiplicados por estes fatores, e
  # com a carga útil perturbada por este fator relativo (da ordem do ruído de ponto flutuante entre CPUs).
  fatores_tolerancia: {valor: [0.5, 2.0], premissa: P-116}
  perturbacao_relativa: {valor: 1.0e-13, premissa: P-116}
  altitudes_reprodutibilidade_km: {valor: [380], premissa: P-116}   # a 814 km o sólido não fecha (results/familia1/mavs.md)

