# Família 1 (Fabio, 2026-11-09): estada longa e orbitador só elétrico, encontro em órbita baixa; dois MAVs comparados.
# Fontes em docs/fontes.md; premissas (NÃO VALIDADAS) em config/premissas.yaml.

missao:
  inicio_busca: {valor: "2029-06-01", premissa: P-109}
  fim_busca: {valor: "2035-01-01", premissa: P-109}
  passo_serie_dias: {valor: 1, premissa: P-109}
  tof_retorno_dias: {valor: [150, 400], premissa: P-109}
  passo_tof_dias: {valor: 5, premissa: P-109}

mav_solido:
  verificacao:   # MAV sólido do MSR de 2019 ([F34]): o modelo deve chegar à órbita publicada com as massas publicadas
    orbita_km: {valor: 350, fonte: "[F34] PDF p. 4: \"Nominal orbit: 351 x 349 km\" (média)"}
    inclinacao_graus: {valor: 25, fonte: "[F34] PDF p. 4: \"Target orbit 343 x 343 km ± 25 deg inclination\""}
    costa_publicada_s: {valor: 446, fonte: "[F34] PDF p. 7: \"including 446 seconds of coast\""}
    fracao_inerte_estagio_2: {valor: [0.30, 0.34, 0.38, 0.40, 0.42, 0.46, 0.50], premissa: P-110}
    modelos_de_empuxo: {valor: [tempo_publicado, empuxo_publicado], premissa: P-111}
  guia:   # P-110: subida vertical, partidas e limites do guiamento do sólido (escolhas numéricas)
    t_v_s: {valor: 5, premissa: P-110}
    partidas: {valor: [[1.0, 0.003, 5.0], [1.2, 0.008, 15.0], [1.4, 0.003, 15.0]], premissa: P-110}
    limites: {valor: [[0.3, 1.55], [0.0, 0.05], [0.0, 60.0]], premissa: P-110}
    tol_custo: {valor: 1.0e-6, premissa: P-110}
    escala_busca: {valor: [0.5, 4.0], premissa: P-110}
    passo_varredura_escala: {valor: 0.05, premissa: P-110}
    passos_escala: {valor: 8, premissa: P-110}

mav_hipergolico:
  diametro_m: {valor: 0.72, fonte: "results/etapa7.2/bocais_alternativas.md, alternativa A: o menor Ø da varredura que contém as 4 saídas de 164:1 com parede"}

termico:
  rhu_w_2014: {valor: 0.90, fonte: "[F155] p. 1: \"As of September 2014, the average thermal power of the RHUs in the DOE's inventory was approximately 0.90 watts each\""}
  rhu_queda_w_ano: {valor: 0.01, fonte: "[F155] p. 1: \"this thermal power will continue to decrease by about one-hundreth of a watt per year\""}
  rhu_ano_referencia: {valor: 2014, fonte: "[F155] p. 1: \"As of September 2014\""}
  rhu_teto_new_frontiers: {valor: 43, fonte: "[F155] p. 2: \"Proposing teams have been offered the chance to use up to 43 RHUs from the existing U.S. inventory\" (teto oferecido ao edital do New Frontiers, não o tamanho do inventário)"}
  envelhecimento_solido:
    - "[F263] PDF p. 1: \"The test plan includes propellant aging first at high vacuum conditions, representative of the Mars transit, followed by an additional year at simulated Mars surface conditions.\""
    - "[F263] PDF p. 2: \"The project has also completed the first of three phases of propellant aging\""
    - "[F263] PDF p. 1: \"the flight heritage is limited and outside the environments, the MAV must endure\""
    - "[F250] PDF p. 2: \"concerns exist with long duration aging associated with baseline CTPB (cold temperature capable) propellant\""
    - "[F248] PDF p. 3: \"The SRL is expected to keep the MAV between -40 °C and +40 °C, enabling the use of propellant that has already been qualified for that temperature range.\""
    - "[F248] PDF p. 13: \"Current qualification minimum temperatures are -50 °C\"; PDF p. 14: \"Data from the analog samples showed cracking at approximately -70 °C\""
  tempo_no_msr:
    - "[F266] (slides do IAC-19) PDF p. 3: \"MAV dwell time in SRL on Mars ~9 months\""
    - "[F35] PDF p. 1: \"After residing on the surface for another year\""

aeroshell_465:   # Fabio, 2026-11-10: família 1 com o aeroshell de 4,65 m (forma SRL-A da 7.2)
  forma: srl_a
  coifa_longa_vulcan:
    estacao_pol: [2596.66, 2846.66, 3066.66, 3186.66, 3336.66]
    diametro_mm: [4877, 4826, 4661, 3632, 609]
    estacao_interface_pol: 2596.66
    fonte: "[F80] Fig. 4.3.1-2, PDF p. 45 (p. 4-9), \"Vulcan Centaur 21.3-m (70-ft.) PLF Simplified Static Payload Envelope\" (leitura da figura): Ø 4877 em \"LV STA 2596.66 (1575 Interface)\", Ø 4826 em LV STA 2846.66, Ø 4661 em LV STA 3066.66, Ø 3632 em LV STA 3186.66, Ø 609 em LV STA 3336.66; PDF p. 44: \"The 21.3-m (70-ft.) long PLF is available as a mission unique offering\""
  lancadores: ["Vulcan VC4", "Vulcan VC6"]
  # Perda de capacidade da coifa longa: sem fonte para o Vulcan (nem massa das coifas); análogo da Atlas V (P-112).
  penalidade_coifa_longa_kg: {valor: 89, premissa: P-112, fonte: "[F27] PDF p. 57, §2.5.2.2 (Atlas V, só GTO): \"For Atlas V 500 series configurations that use the 5-m long PLF, the typical range of performance degradation is 89 kg (197 lb) for the Atlas V 511 and 521, to 70 kg (155 lb) for the Atlas V 531 through 551 for GTO missions.\""}
  capacidade_coifa_longa: "[F80] não publica a capacidade para C3 de Marte com a coifa longa: a Tab. 2.2.5-1 (PDF p. 21) só traz VC2S, VC4S e VC6S (coifa padrão)"

# Política de margem do MAV sólido do MSR, como está nas fontes (Fabio, 2026-11-10, item 3a). Nenhuma fonte dá uma margem
# de Δv nem diz se o comprimento de 2,7 m já a incluía.
politica_margem_msr:
  - "[F34] PDF p. 6: \"A mass growth allowance of 19% and 17% was assigned to the first and second stage structures, respectively.\""
  - "[F34] PDF p. 7: \"the MAVSolid trajectory was designed so that it targeted above the ideal orbit altitude in order to maintain the minimum periapsis of 300 km, including when performance parameters like ISP, payload mass, launch angle, and azimuth were selectively dispersed.\""
  - "[F248] PDF p. 12: \"Trajectories delivered the expected ~4 kg payload margin.\""
  - "[F248] PDF p. 17: \"a MAV solid propulsion system was designed that allowed the vehicle to maintain a GLOM 6 kg below the 400 kg limit.\""
  - "[F230] PDF p. 6: \"The designs themselves included a length margin of 10cm on SRM1 and 1.8kg of propellant mass margin in SRM2.\""
  - "[F267] PDF p. 3 (Tab. 1, requisitos do estudo de conceito de 2018): \"Performance Margin\" — \"Addtl. 5 kg payload\"; \"Other Margin Allocation\" — \"AIAA margins / 25% for unknowns\""
