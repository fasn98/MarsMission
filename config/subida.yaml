# Subida do MAV com o empuxo/peso real (portão da rota A, Fabio, 2026-11-07). Modelo em src/orbital/subida.py.
# Fontes em docs/fontes.md; premissas (NÃO VALIDADAS) em config/premissas.yaml.

atmosfera:   # [F245] NASA Glenn, "Mars Atmosphere Model - Metric Units" (página educacional, atualizada em 13/05/2021)
  t0_baixa_c: {valor: -31, fonte: "[F245]: \"T = -31 - 0.000998 * h\""}
  dtdh_baixa: {valor: -0.000998, fonte: "[F245]: \"T = -31 - 0.000998 * h\""}
  h_troca_m: {valor: 7000, fonte: "[F245]: \"The lower atmosphere runs from the surface of Mars to 7,000 meters.\""}
  t0_alta_c: {valor: -23.4, fonte: "[F245]: \"T = -23.4 - 0.00222 * h\""}
  dtdh_alta: {valor: -0.00222, fonte: "[F245]: \"T = -23.4 - 0.00222 * h\""}
  p0_kpa: {valor: 0.699, fonte: "[F245]: \"p = .699 * exp(-0.00009 * h)\""}
  k_1_m: {valor: 0.00009, fonte: "[F245]: \"p = .699 * exp(-0.00009 * h)\""}
  r_kpa: {valor: 0.1921, fonte: "[F245]: \"r = p / [.1921 * (T + 273.1)]\""}
