  fontes_p086:
    - {item: "Comprimento total do MAV do MSR", achado: "limite de 2,99 m com Ø 0,5 m (SRC); 3,0 m com Ø 0,57 m (DAC-0.0); 2,8 m com Ø 0,57 m (2019). Nenhuma traz a divisão por elemento", fonte: "[F35] p. 3; [F236] PDF p. 2; [F238] PDF p. 15"}
    - {item: "Divisão por elemento", achado: "não há divisão completa em nenhuma das fontes consultadas; há uma figura sem cotas por trecho e cotas soltas, nas linhas abaixo", fonte: "[F237] PDF p. 4; [F35]; [F236]; [F238]"}
    - {item: "Bocal aninhado", achado: "o 2º estágio tem o bocal dentro do interestágio, e isso aparece como risco na separação; a fonte não dá o comprimento aninhado", fonte: "[F35] PDF p. 15: \"the small clearances of the interstage hardware and the nested SRM2 nozzle\"; [F236] PDF p. 13: \"clearance of the nested second stage nozzle hardware\""}
    - {item: "Encurtar bocal e interestágio", achado: "o estudo troca Isp por comprimento no 2º estágio: cerca de 10 s a menos, num bocal de expansão 81 e Isp 293 s. A Fig. 10 tem o melhor ponto perto de −0,15 m no bocal, com GLOM cerca de 8 kg menor com o plano de separação na saída do bocal e 14 kg menor perto da flange, mas nesta segunda curva quase 12 kg já existem sem encurtar o bocal (leitura da figura, NÃO VALIDADO). Motor sólido, com o bocal aninhado desenhado no interestágio", fonte: "[F238] PDF p. 10: \"trading I sp for nozzle length\"; \"a significantly shorter inter-stage and nozzle\"; Fig. 10, eixo \"Nozzle Length change, m\""}
    - {item: "Motor do 1º estágio (MSR de 2019)", achado: "caixa do motor em três níveis de propelente, de 30,5 a 31,7 pol; é cota de um elemento, de motor sólido, sem o bocal completo, e não a divisão do veículo", fonte: "[F238] PDF p. 12, Fig. 11: \"525-lb prop, 31.7 inch case\"; \"475-lb prop, 30.5 inch case\""}
  variante_44_1:
    analogos_isp:   # NÃO são o R-4D-11: mesma classe e mesma expansão; valores só para a sensibilidade
      - {nome: "440 N, Re", isp_s: 308, fonte: "[F239] PDF p. 7: \"Performance of 308 seconds at 44:1 area ratio was achieved\""}
      - {nome: "440 N, Nb (\"similar Nb engines\", \"the Nb engine\")", isp_s: 304, fonte: "[F239] PDF p. 7: \"about 4 seconds higher than similar Nb engines\" (308 − 4) e \"about 10 seconds higher than the Nb engine\" (314 − 10); calculado"}
      - {nome: "440 N, Re, injetor de programa anterior", isp_s: 314, fonte: "[F239] PDF p. 7: \"Performance of 314 seconds at an area ratio of 44:1 was measured. This performance is about 10 seconds higher than the Nb engine\""}
      - {nome: "AJ10-221, 110 lbf, Ir-Re, testes", isp_s: 310.4, fonte: "[F241] PDF p. 42, Tab. 2.2-3, \"44:1 Performance for Injectors SN 6-1 and SN 6-2\": de 306,4 a 310,4 s; aqui, o maior"}
      - {nome: "445 N, Ir-Re, sem filme de combustível", isp_s: 309.5, fonte: "[F243] PDF p. 8: \"3033 ± 1.5 N-s/kg (309.5 ± 0.15 lbf sec/lbm) at E = 44:1\""}
      - {nome: "490 N, três injetores", isp_s: 309, fonte: "[F240] resumo no NTRS: \"Three injectors with 44:1 area ratios are capable of nominal specific impulse values of 309 sec\" (só o resumo; artigo não obtido)"}
    onde_procurou:
      - "[F228] PDF p. 22: 44:1 só nas cotas do desenho; sem Isp, massa ou empuxo próprios"
      - "[F106] e [F107]: não citam 44:1 (conferido nas citações do repositório; [F106] sem cópia local)"
      - "NTRS, cerca de 45 buscas (2026-11-06): só análogos de Ir-Re a 44:1, [F239], [F240], [F241] e [F243]; \"R-4D-11\" não retorna nada. R-4D do Apollo é de 40:1 [F242]"
      - "AIAA: arc.aiaa.org recusa o acesso (403); AIAA 92-3800 e AIAA 2010-6884 não lidos; IAC-10.C4.1.6, só o resumo, sem 44:1"
      - "Fichas do fabricante: rocket.com e l3harris.com recusam ou não acham (403 e 404); três PDFs arquivados no Internet Archive não abertos"
      - "Missões: nenhuma com 44:1 documentado. Apollo, 40:1; Orion, 164:1 [F107]; Cassini, ATV, Galileo e outras: sem razão de expansão em fonte primária lida"
      - "Páginas de terceiros (Wikipedia, Astronautix e catálogos) não contam como fonte primária e não dão o 44:1"
