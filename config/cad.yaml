    fonte_razao: "[F242] PDF p. 15: \"with an expansion ratio equal to 40\", da câmara inicial; as outras páginas não repetem ε"
    dados:
      - {pagina: "PDF p. 15", texto: "\"good performance Isp's of 295 and 297\"; \"its maximum performance, Isp slightly over 310 seconds\", em O/F perto de 1,9 (sem ε, pressão nem regime na frase)"}
      - {pagina: "PDF p. 19", texto: "\"295 to 300 seconds of impulse\", em O/F de 1,8 a 1,9"}
      - {pagina: "PDF p. 26, Fig. 12", texto: "cerca de 300 s em O/F de 1,6 a 1,9, pontos de 298 a 302 s perto de 1,65 e máximo perto de 304 s em O/F de cerca de 1,93, leitura a olho, sem ε na figura"}
      - {pagina: "PDF p. 62", texto: "\"maintained a mean Isp of 300 seconds\""}
      - {pagina: "PDF p. 66", texto: "\"the Isp was 295 seconds\" com sangria de combustível para filme; cerca de 304 s sem filme"}
      - {pagina: "PDF p. 81", texto: "\"Isp = 273 seconds at an O/F of 2.0\"; \"was 313 seconds at an O/F of 2.0\" (OCR corrigido), injetor triplet"}
      - {pagina: "PDF p. 87", texto: "configuração PFRT, \"Isp (steady state) = 286 ± 6 seconds\""}
    ressalva: "O programa relata de 273 a 313 s, conforme injetor, resfriamento e O/F, então a comparação discrimina pouco. O R-4D do Apollo também teve outra câmara (molibdênio com revestimento), outro injetor, O/F perto de 1,8 a 2,0 contra 1,65 no R-4D-11 ([F228] PDF p. 22), e passou por MMH e A-50 (PDF p. 19, que diz a diferença \"very small\"). Na Fig. 12, perto de O/F 1,65, os pontos vão de 298 a 302 s: o central calculado fica abaixo deles, e a parte de baixo cai dentro da faixa calculada. O valor de pouco mais de 310 s não diz ε, pressão nem regime: se fosse de 40:1 em regime permanente, contrariaria o modelo. Não conferido."

