    isp_referencia: {valor: 297, fonte: "[F242] PDF p. 15: \"This prototype engine demonstrated good performance Isp's of 295 and 297\"; \"maximum performance\" de pouco mais de 310 s, em outra razão de mistura; câmara inicial \"with an expansion ratio equal to 40\""}
    ressalva_analogos: "Os análogos de 306 a 314 s têm câmara de irídio e rênio, ou, em [F240], só o resumo cita essa tecnologia. Os motores convencionais de 110 lbf são outros: [F241] PDF p. 18: \"Conventional 110 lbf engines use up to ~40% fuel film cooling\"; \"may produce a performance loss of up to 25 sec\"; \"10 sec higher than conventional 110 lbf silicide coated Cb chambers now in use\", a 286:1. Aplicar isso ao R-4D-11 e ao 44:1 é inferência (NÃO VALIDADO): nenhuma fonte lida diz a construção da câmara do R-4D-11."
    tanques_aninhados: {fonte: "[F46] §5.4, PDF p. 17: \"Similar to a common bulkhead design, the forward tank aft dome is accommodated within a recessed aft tank forward dome but with a purge gap between the two tanks. The inter-tank section is eliminated\"", ressalva: "a conta não desconta o vão de purga nem muda a massa dos tanques"}
