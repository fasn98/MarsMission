# Fase 7 (CAD paramétrico), Etapa 7.1: envelope e arranjo. Usado por tools/envelope_arranjo.py.
# Fontes em docs/fontes.md; premissas (NÃO VALIDADAS) em config/premissas.yaml. Comprimentos em m, massas em kg.
# Nenhuma dimensão é digitada no FeatureScript (Etapa 7.2): todas saem daqui ou de results/ por tools/.

# Decisões do Fabio no portão da Etapa 7.1 (ADR 0022).
escolha:
  aeroshell: srl_duplo        # 4,65 m, com a condição de conferir a folga no Vulcan com a geometria real (Etapa 7.2)
  aeroshell_alternativa: m2020  # 4,5 m, se a folga não se confirmar; a massa por área de 279 kg/m² vira risco de EDL
  mav_diametro: restricao_2019  # 0,57 m; o limite de 3 m do MSR é referência, não restrição
  orbitador_pares: 2

propelentes:
  densidade_mmh_kg_m3: {valor: 869, fonte: "[F211] p. 5 impressa (PDF p. 10), Tab. I: \"Density @ 26.5±1.5°C g/cc\"; linha MMH 100 %, aditivo 0: \"0.869\""}
  # MON-3 sem densidade tabelada encontrada; usa-se a do N2O4 puro a 25 °C (P-078).
  densidade_oxidante_kg_m3: {valor: 1431, premissa: P-078, fonte: "[F212] p. 121 impressa (PDF p. 129), Tab. 4-XII \"DENSITY OF LIQUID N2O4 (Under its Own Vapor Pressure)\": \"77.0 1.431\" (°F; densidade relativa)"}
  densidade_hidrazina_kg_m3: {valor: 1004, premissa: P-079}
  razao_mistura_r4d11: {valor: 1.65, fonte: "[F107] p. 6, Tab. 4 \"Evolution of Aux Engine Requirements\": \"Mixture 1.65 1.85 1.74\" (requisito inicial; o Artemis I voou com 1,74, Tab. 3)"}
  razao_mistura_cruzeiro_lander: {valor: 1.65, premissa: P-080}
  fracao_ullage: {valor: 0.05, premissa: P-081}

# Arranjo dos tanques (P-082): esféricos, dois de oxidante e dois de combustível por estágio do orbitador, em quadrado
# em torno do cilindro central; um par no estágio de cruzeiro do lander. Alternativa calculada: um par por estágio.
tanques:
  pares_por_estagio_orbitador: {valor: 2, premissa: P-082}
  pares_estagio_cruzeiro_lander: {valor: 1, premissa: P-082}
  folga_entre_conjuntos_m: {valor: 0.10, premissa: P-087}
  folga_radial_m: {valor: 0.05, premissa: P-087}

coifas:
  # Falcon Heavy (orbitador, ADR 0020): volume útil da coifa padrão, recuperável, com mantas acústicas, PAF de 1575 mm.
  # Perfil (altura acima do plano do PAF, raio) lido do arquivo STEP do fabricante com OpenCascade; raio máximo em cada
  # faixa de 500 mm (amostra na base da faixa; na ogiva, a interpolação linear entre amostras fica do lado seguro).
  falcon_padrao:
    nome: "Falcon, coifa padrão (5,2 m), volume útil com mantas, PAF de 1575 mm"
    diametro_externo_m: {valor: 5.2, fonte: "[F82] p. 16 (PDF p. 27): \"The standard SpaceX Falcon fairing is 5.2 m (17.2 ft) in outer diameter and 13.2 m (43.5 ft) high overall.\""}
    perfil:
      altura_m: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0, 11.3476]
      raio_m: [2.3230, 2.3201, 2.3160, 2.3118, 2.3077, 2.3035, 2.2994, 2.2953, 2.2911, 2.2870, 2.2827, 2.2787, 2.2745, 2.2704, 2.2606, 2.2099, 2.1051, 1.9619, 1.7996, 1.5966, 1.3356, 1.0023, 0.5787, 0.0]
      fonte: "[F82] p. 16 (PDF p. 27): \"The payload static envelope for the recoverable standard fairing with acoustic blankets installed is available for download in Table 4-1\"; arquivo FAIRING_KEEP_IN_RECOVERABLE_WITH_BLANKETS_1575_PAF_A-1.stp (\"Payload Keep-in Volume, With Acoustic Blankets, 1575 mm PAF\"), em polegadas; lido com OpenCascade (cadquery-ocp, fora das dependências do projeto): malha de 0,2 mm, faixas de 500 mm a partir da origem, raio = máximo de √(y² + z²) dos nós da malha em cada faixa, eixo x; topo em 11,3476 m. A origem do arquivo foi tomada como o plano do PAF: não conferido."
  # Vulcan (lander, ADR 0020): coifa de 15,5 m; envelope estático lido da figura (cotas em mm; estações em polegadas).
  vulcan_15_5:
    nome: "Vulcan, coifa de 15,5 m, envelope estático acima do plano do PAF de 1575 mm"
    diametro_externo_m: {valor: 5.4, fonte: "[F80] Tab. 1.5-1, p. 1-5: \"Composite 5.4-m Diameter Payload Fairing\""}
    perfil:
      # alturas: (estação − 2596,66 pol) × 0,0254; raios: metade das cotas de diâmetro em mm (calculado aqui)
      estacao_pol: [2596.66, 2856.66, 2966.66, 3100.66]
      diametro_mm: [4877, 4648, 3632, 838]
      estacao_interface_pol: 2596.66
      fonte: "[F80] Fig. 4.3.1-1, p. 4-8 (PDF p. 44), \"Vulcan Centaur 15.5-m (51-ft.) PLF Simplified Static Payload Envelope\": Ø 4877 em \"LV STA 2596.66 (1575 Interface)\", Ø 4648 em \"LV STA 2856.66\", Ø 3632 em \"LV STA 2966.66\", Ø 838 em \"LV STA 3100.66\" (leitura da figura)"
  vulcan_reserva: "VC6 usa a mesma coifa (lançador de reserva, ADR 0020)"

encaixe:   # Etapa 7.2b: verificação geométrica do modelo nas coifas, no Onshape
  versao_featurescript: {valor: 3112, fonte: "observação de ambiente: conta do Fabio no Onshape, docs/etapa7.2_featurescript.md; não é dado científico"}
  espessura_casca_envelope_m: {valor: 0.01, natureza: "escolha de construção, não premissa: só desenha a casca; as folgas são medidas na face interna e não dependem dela"}
  cor_envelope: {valor: [0.15, 0.55, 0.85, 0.25], natureza: "aparência (r, g, b, alpha: 1 é opaco), sem efeito em nenhum número"}
  # parâmetros numéricos de implementação. APROVADOS pelo Fabio (2026-11-06), com a exportação em 13 algarismos: (a) e (b) de
  # results/etapa7.2b/folgas.md passam no critério abaixo. A aprovação fica registrada aqui, não sai do script.
  empate_m: {valor: 1.0e-9, justificativa: "peças simétricas empatam; quem tira o posto de limitadora precisa ser menor por mais que isto, para o texto de results/ não depender do ruído entre CPUs. Fica acima da maior diferença entre peças exatamente simétricas e abaixo da menor diferença real entre peças distintas (valores em results/etapa7.2b/folgas.md)"}
  casas_de_ordem: {valor: 9, justificativa: "casas decimais em metros (1e-9 m, a mesma escala de empate_m), usadas para agrupar peças empatadas e ordenar listas do texto gerado; não muda nenhum valor gravado"}
  criterio_empate: {simetricas_max_m: 1.0e-12, distintas_min_m: 1.0e-6, fonte: "decisão do Fabio, 2026-11-06"}
  plano_vulcan: {fonte: "[F80] Fig. 4.3.1-1, p. 4-8: \"LV STA 2596.66 (1575 Interface)\""}
  plano_falcon: {fonte: "[F82] PDF p. 26: \"The origin of the payload coordinate system is fixed at the center of the separation plane\"; o arquivo STEP não declara que usa esse sistema (P-096)"}
  premissas_propostas: []   # só entram em config/premissas.yaml com a aprovação do Fabio; P-096 e P-097 já entraram

aeroshell:
  # Opções de diâmetro (decisão do Fabio no portão da 7.1): a massa de entrada do lander fica entre a do Mars 2020 e a
  # do SRL de lançamento duplo.
  opcoes:
    m2020:
      diametro_m: {valor: 4.5, fonte: "[F202] p. 13: \"Capsule diameter (m) 4.5 4.5 4.65 >5.4\" (MSL, Mars 2020, SRL lançamento duplo, SRL lançamento único)"}
      massa_entrada_kg: {valor: 3360, fonte: "[F202] p. 13: \"Entry mass (kg) 3150 3360 >5000 >7500\""}
    srl_duplo:
      diametro_m: {valor: 4.65, fonte: "[F202] p. 13 (mesma tabela); p. 12: \"A capsule diameter > 4.65-m may lead to a new launch vehicle fairing\""}
      massa_entrada_min_kg: {valor: 5000, fonte: "[F202] p. 13: \"Entry mass (kg) ... >5000\" (SRL lançamento duplo)"}
  semiangulo_frente_graus: {valor: 70, fonte: "[F215] PDF p. 3: \"The MSL aeroshell is a 4.5-meter diameter spherically-blunted 70-degree half-angle cone forebody with a triconic afterbody\""}
  # Conjunto estágio de cruzeiro + aeroshell do MSL; a altura escala com o diâmetro (P-083).
  msl_conjunto:
    diametro_m: {valor: 4.5, fonte: "[F214] PDF p. 6: \"Cruise vehicle dimensions (cruise stage and aeroshell with rover and descent stage inside): Diameter: 14 feet, 9 inches (4.5 meters); height: 9 feet, 8 inches (3 meters)\""}
    altura_m: {valor: 3.0, fonte: "[F214] PDF p. 6 (mesma citação)"}
    escala_altura: {premissa: P-083}
  folga_interna_m: {valor: 0.25, premissa: P-087}

descida:
  # Propelente de descida (hidrazina, como no MSL) escalado pela massa de entrada (P-084).
  msl_propelente_kg: {valor: 387, fonte: "[F214] PDF p. 37: \"Three spherical fuel tanks provide a usable propellant load of about 853 pounds (about 387 kilograms) of hydrazine\""}
  msl_massa_entrada_kg: {valor: 3150, fonte: "[F202] p. 13: \"Entry mass (kg) 3150 3360 >5000 >7500\" (MSL)"}
  msl_tanques: {valor: 3, fonte: "[F214] PDF p. 37 (mesma citação: \"Three spherical fuel tanks\")"}
  escala: {premissa: P-084}

mav:
  # Diâmetro: opções com fonte (decisão do Fabio). Tanques cilíndricos com tampos hemisféricos no diâmetro interno (P-085);
  # o comprimento que não é tanque (motores, interestágio, carga) é premissa (P-086).
  diametro_opcoes_m:
    src_2022: {valor: 0.50, fonte: "[F35] p. 3: \"a maximum MAV target mass allocation of 400kg with a geometric length not to exceed 2.99m and a diameter not to exceed 0.5m\""}
    restricao_2019: {valor: 0.57, fonte: "[F216] p. 3, tabela de restrições: \"Vehicle Length 3 m (max.)\", \"Vehicle Diameter 0.57 m (max.)\", \"Vehicle Mass 400 kg (max.)\""}
  comprimento_max_src_m: {valor: 2.99, fonte: "[F35] p. 3 (mesma citação)"}
  comprimento_max_2019_m: {valor: 3.0, fonte: "[F216] p. 3 (mesma tabela)"}
  bowles_analogo:
    comprimento_m: {valor: 2.19, fonte: "[F46] Tab. 2, p. 23 impressa (PDF p. 27), coluna 20 kg: \"Length, m 2.19\"; \"Diameter, m 0.52\"; \"GLOW, kg 312.5\""}
    diametro_m: {valor: 0.52, fonte: "[F46] Tab. 2, p. 23 impressa (mesma citação)"}
    glow_kg: {valor: 312.5, fonte: "[F46] Tab. 2, p. 23 impressa (mesma citação)"}
  espessura_parede_m: {valor: 0.01, premissa: P-085}
  comprimento_nao_tanque_m:
    motores_estagio_1: {valor: 0.60, premissa: P-086}
    motor_estagio_2: {valor: 0.45, premissa: P-086}
    interestagio: {valor: 0.10, premissa: P-086}
    carga_os: {valor: 0.35, premissa: P-086}

lander:
  # Painéis da Etapa 4.1 (área em results/etapa4.1) em duas asas circulares (P-088), como o Phoenix e o InSight.
  asas_paineis: {valor: 2, premissa: P-088}
  phoenix:
    deck_diametro_m: {valor: 1.5, fonte: "[F40] PDF p. 6: \"span of deployed solar arrays 5.52 meters (18.1 feet); deck diameter 1.5 meters (4.9 feet); length of robotic arm 2.35 meters (7.71 feet)\""}
    envergadura_paineis_m: {valor: 5.52, fonte: "[F40] PDF p. 6 (mesma citação)"}
  braco_comprimento_m: {valor: 2.35, fonte: "[F40] PDF p. 6 (mesma citação; braço do Phoenix como análogo)"}
  helicoptero:
    raio_rotor_m: {valor: 0.7, fonte: "[F213] PDF p. 6: \"blade (0.7 m radius, 0.128 solidity, thrust-weighted chord)\" (SRH)"}
    altura_m: {valor: 0.49, fonte: "[F217] p. 12: \"Height: 1.6 feet (0.49 meters)\" (Ingenuity; altura do SRH não publicada)"}

orbitador:
  ccrs_m:
    dimensoes: {valor: [3.4, 0.5, 2.0], fonte: "[F23] p. 7, legenda da Fig. 9: \"The overall dimensions of CCRS are approximately 3.4 m × 0.5 m × 2 m.\""}
  ees_semiangulo_graus: {valor: 52.5, fonte: "[F26] p. 3: \"The basic test article geometry is a 52.5-deg sphere-cone shape\""}
  ees_diametro_m: {valor: 1.273, fonte: "[F26] p. 3: \"The basic test article geometry is a 52.5-deg sphere-cone shape with a 1.273 m diameter and 0.3146 m nose radius\" (artigo em escala real)"}
  cilindro_central_diametro_m: {valor: 1.575, fonte: "[F82] p. 17 (PDF p. 28): PAF de 1575 mm (o cilindro central do orbitador acompanha a interface; escolha de arranjo, P-082)"}

# ------------------------------------------------------------------------------------------------- Etapa 7.2
# Perfis externos das cápsulas, lidos da Fig. 2 de [F41] (raio em função da distância ao nariz, m). Leitura feita pelos
# pixels das curvas coloridas, com o quadro do gráfico como escala; o MSL/M2020 sai com raio máximo de 2,26 m (Ø 4,52,
# contra 4,5 m publicados [F214]), o que dá a ordem do erro de leitura. O nariz rombudo entra como o vértice (0,02; 0,25).
capsulas:
  msl_m2020:
    x_m: [0.0, 0.02, 0.85, 1.90, 2.40, 2.88, 2.88]
    r_m: [0.0, 0.25, 2.26, 1.49, 0.66, 0.40, 0.0]
    fonte: "[F41] Fig. 2, p. 2: \"Figure 2 shows two of the SRL geometry options used for the analysis in this paper, compared with MSL/Mars 2020\"; \"All dimensions in meters\" (curva MSL/M2020, leitura da figura)"
  srl_a:
    x_m: [0.0, 0.02, 0.85, 2.00, 2.60, 3.85, 3.85]
    r_m: [0.0, 0.25, 2.34, 1.75, 1.20, 0.40, 0.0]
    fonte: "[F41] Fig. 2, p. 2 (curva SRL-A; coincide com a SRL-C até cerca de 2,0 m; leitura da figura)"
  srl_c:
    x_m: [0.0, 0.02, 0.85, 2.00, 2.60, 3.50, 3.55]
    r_m: [0.0, 0.25, 2.36, 1.75, 1.29, 0.44, 0.0]
    fonte: "[F41] Fig. 2, p. 2 (curva SRL-C, fundo arredondado; leitura da figura)"
  # P-089: o CAD usa a SRL-A (a mais longa); a conferência na coifa usa a pior folga entre SRL-A e SRL-C
  forma_da_opcao: {srl_duplo: srl_a, m2020: msl_m2020}
  semiangulo_nota: "a frente das três curvas coincide com o cone de 70° [F215]"
  espessura_pica_m: {valor: 0.03175, fonte: "[F215] PDF p. 3: \"A uniform PICA thickness of 1.25 in was established for MSL\" (1,25 pol = 0,03175 m)"}
  espessura_casca_traseira_m: {valor: 0.0127, fonte: "[F225] PDF p. 4: \"The nominal uniform thickness of SLA-561V for Mars 2020 was 1.27 cm (0.5 inch), the same as it was for MSL.\""}

lancamento_lander:
  frente_para_cima: {valor: true, premissa: P-091}
  altura_estagio_cruzeiro_m: {premissa: P-091, nota: "conjunto do MSL (3,0 m [F214]) menos o comprimento da cápsula MSL/M2020 lido de [F41] (calculado na ferramenta)"}

mav_no_aeroshell:
  # Estações (distância ao nariz) da base do MAV deitado, varridas para achar onde ele deixa de caber (P-092).
  estacao_base_m: [0.85, 0.95, 1.05, 1.15, 1.25, 1.35, 1.45]
  estacao_base_referencia_m: {valor: 0.85, premissa: P-092}

materiais:   # densidades em kg/m³
  ti_6al_4v: {nome: "Ti-6Al-4V", valor: 4424, fonte: "[F219] p. 81 impressa (PDF p. 88), §9.1: \"Density at room temperature 0.160 lbs/in3 (4.424 g/cm3)\""}
  al_2219: {nome: "Al 2219", valor: 2840, fonte: "[F220] PDF p. 6: \"Density --- 2.84 g/cm3 at room temperature\""}
  al_7075: {nome: "Al 7075", valor: 2800, fonte: "[F221] PDF p. 114, §9.1: \"0.101 lb/in3 at 68°F\"; \"9.11 Specific Gravity 2.80\" (20 °C)"}
  cfrp_im7_8552: {nome: "CFRP IM7/8552 (fita unidirecional)", valor: 1574, fonte: "[F222] p. 25, §4.7: \"It was determined that the density was 98.28 lb/ft3 for the tape\" (98,28 lb/ft³ = 1574 kg/m³, calculado aqui)"}
  pica: {nome: "PICA", valor: 274, fonte: "[F223] PDF p. 12: \"the nominal PICA value of 0.274 g/cm3\""}
  sla_561v: {nome: "SLA-561V", valor: 256, premissa: P-090}
  mmh: {nome: "MMH", referencia: propelentes.densidade_mmh_kg_m3}
  mon3: {nome: "MON-3", referencia: propelentes.densidade_oxidante_kg_m3}
  hidrazina: {nome: "Hidrazina", referencia: propelentes.densidade_hidrazina_kg_m3}

construcao:   # P-093: materiais e espessuras das peças modeladas pela geometria
  tanques: {material: ti_6al_4v, espessura_m: {valor: 0.0015, premissa: P-093}}
  raio_minimo_m: {valor: 0.005, premissa: P-093}   # menor raio de um tronco no FeatureScript (pontas de cone)
  cilindro_central: {material: al_2219, espessura_m: {valor: 0.003, premissa: P-093}}
  # Peças sem geometria própria (massa do orçamento, results/etapa2.5/arquitetura.yaml, em volume do arranjo): densidade
  # equivalente = massa / volume (P-094). A massa delas no CAD é a do orçamento por construção.
  equivalentes:
    plataforma_orbitador_altura_m: {valor: 0.30, premissa: P-094}
    deck_lander_altura_m: {valor: 0.30, premissa: P-094}
    ees_raio_ponta_m: {valor: 0.0064, premissa: P-094}   # raio da ponta do cone do EES

arranjo_lander:   # P-095: arranjo interno (lançamento e entrada); posições em m; eixo da cápsula = z; MAV ao longo de y
  raio_tanques_cruzeiro_m: {valor: 1.5, premissa: P-095}
  raio_tanques_descida_m: {valor: 1.4, premissa: P-095}
  angulos_tanques_descida_graus: {valor: [0, 120, 240], premissa: P-095}
  braco_posicao_x_m: {valor: 0.45, premissa: P-095}
  braco_raio_m: {valor: 0.05, premissa: P-095}
  helicopteros_posicao_y_m: {valor: 0.75, premissa: P-095}
  folga_entre_pecas_m: {valor: 0.05, premissa: P-095}

mav_alternativas:   # pedido do Fabio no portão da 7.2 (faixa dada por ele): varredura antes de decidir aeroshell e MAV (tools/mav_arranjo.py)
  diametros_m: [0.57, 0.60, 0.63, 0.66, 0.69, 0.72, 0.75]
  formas: [msl_m2020, srl_a]
  # estações da base: o plano do ombro, o ombro + metade da altura do deck e o ombro + a altura do deck (P-094),
  # calculadas na ferramenta a partir do perfil e da P-094


entrada_referencia:   # MSL: deslocamento radial do CG usado para trimar e gerar sustentação (tools/cg_lateral.py)
  msl_zcg_sobre_d: {valor: -0.0215, fonte: "[F226] PDF p. 4, Fig. 2, coluna nominal: \"zcg/d = -0.0215\""}
  msl_dref_m: {valor: 4.500, fonte: "[F226] PDF p. 3, Fig. 1: \"dref = 4.500 m\""}
  msl_trimagem_graus: {valor: -16, fonte: "[F226] PDF p. 2: \"approximately −16◦ at hypersonic conditions\""}
  msl_l_sobre_d: {valor: 0.24, fonte: "[F227] PDF p. 5: \"a hypersonic lift-to-drag ratio (L/D) of 0.24 by means of six balance masses\""}
  msl_massas_balanco_entrada: {valor: 6, massa_cada_kg: 25, fonte: "[F214] PDF p. 28: \"This set of six weights, the “entry balance mass devices,” each has a mass of about 55 pounds (25 kilograms)\""}
  msl_massas_balanco_cruzeiro: {valor: 2, massa_cada_kg: 75, fonte: "[F214] PDF p. 27: \"two solid-tungsten weights, called the “cruise balance mass devices.” ... which weigh about 165 pounds (75 kilograms) each\""}
  pecas_do_estagio_de_cruzeiro: ["Tanque cruzeiro", "Propelente cruzeiro", "Circuito de fluido"]   # prefixos dos nomes (tools/cad_parametros.py)
  # varredura do propelente de cruzeiro restante (fração do carregado), consumido na razão de mistura da P-080
  fracoes_propelente_cruzeiro: [1.0, 0.75, 0.5, 0.25, 0.0]

# Portão da 7.2 (tools/portao_7_2.py): o que as fontes dizem sobre a P-086 (a premissa não muda aqui).
r4d11_variantes:   # [F228] PDF p. 22; cotas em polegadas ("DIMENSIONS ARE IN INCHES"); somar as 2,5 pol à frente da flange é leitura do desenho
  a_frente_da_flange_pol: {valor: 2.5, fonte: "[F228] PDF p. 22, desenho: \"2.5\""}
  "44:1": {flange_a_saida_pol: 9.97, diametro_saida_pol: 6.01, fonte: "[F228] PDF p. 22, desenho: \"44:1 = 9.97\"; \"44:1 = 6.01\" (sem Isp nem massa na folha)"}
  "164:1": {flange_a_saida_pol: 19.32, diametro_saida_pol: 11.0, isp_s: 311, massa_kg: 3.76, fonte: "[F228] PDF p. 22: \"164:1 = 19.32\"; \"164:1 = 11.0\"; \"164:1 = 311 sec\"; \"164:1 = 3.76 kg (8.3 lbm)\""}
  "300:1": {flange_a_saida_pol: 26.5, diametro_saida_pol: 14.84, isp_s: 315.5, massa_kg: 4.31, fonte: "[F228] PDF p. 22: \"300:1 = 26.5\"; \"300:1 = 14.84\"; \"300:1 = 315.5 sec\"; \"300:1 = 4.31 kg (9.5 lbm)\""}
comparacao_bowles:   # conceito final hipergólico pressurizado de 20 kg de carga, coluna "Inert" da Tab. 11 de [F46]
  estagios: {valor: "1", fonte: "[F46] PDF p. 44: \"resulted in a single stage-to-orbit architecture\""}
