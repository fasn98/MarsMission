# Etapa 4.5: lista de massas do lander de baixo para cima (tools/lista_massas_lander.py).
# Nenhuma fonte primária pública publica a massa de um lander de Marte por subsistema (pesquisa de 2026-11-01): o núcleo
# (estrutura, pernas, propulsão de descida seca, térmico, aviônica, cabeamento, sistema de lançamento do MAV) fica de cima
# para baixo (L3, P-017). A lista identifica os itens novos das Etapas 4.1 a 4.4 e confere se o L3 os comporta.
itens_novos:
  rhu_massa_g: {valor: 42.0, fonte: "[F152] p. 5 do PDF, Tab. 1: \"Mass (max) 42.00 grams\""}
  lvs_camera_kg: {valor: 0.865, categoria: eletronica_0_5kg, fonte: "[F203] p. 6: \"LCAM Specs ... power <4.0W, mass 0.865 kg\""}
  lvs_vce: "massa não publicada (Mars 2020 e ELViS): não quantificada"
referencias_nucleo:
  m2020_descida_seca_kg: {valor: 688.2, fonte: "[F204] p. 408 do PDF (impr. 406): \"mass ds dry = 688.2 kg (CBE)\" (descent stage do Mars 2020, sky crane)"}
rejeicao_calor_cruzeiro:
  # dissipação máxima do LAMP (322 W) e perda passiva máxima do LAMP (200 W) do SRL [F165]: config/termico.yaml
  mpf_massa_max_kg: {valor: 18, fonte: "[F205] p. 2: \"Maintain a total HRS mass of less than 18 kg including working fluid\""}
  mpf_calor_w: {valor: 180, fonte: "[F205] p. 2: \"Transfer 90 to 180 Watts of heat to radiator\""}
  msl_circuito: "[F206] p. 20: \"Cruise Fluid Loop thermally controls: • Rover (150 W) • Cruise electronics (50 W) [...] • RTG (2000 W) • Freon-11 • Silver/Teflon tape for Cruise Radiator (6 m2)\" (o texto extraído intercala \"IPA Transfer Lines (tube length: 8m)\")"
  m2020_circuito: "[F207] p. 2: \"large radiator panels as part of the CHRS (cruise heat rejection system). This mechanically pumped fluid loop transports heat\""
mav_isp:   # mitigação por Isp maior (sensibilidade só de Isp; herança de voo conforme a coluna voo)
  - {motor: "R-4D-11 (base, Orion)", isp_s: 310, propelente: MMH/MON-3, voo: "Artemis I [F107]", fonte: "[F107] p. 6 (Tab. 3)"}
  - {motor: "LEROS 1b", isp_s: 317, propelente: MON/hidrazina, voo: "Juno, MESSENGER, Mars Global Surveyor [F208]", fonte: "[F208]: \"317 second Isp, MON/ Hydrazine dual mode apogee engine\"; \"Has flown on the following missions: Jupitor Juno, Mercury Messenger, Mars Global Surveyor\""}
  - {motor: "S400-15", isp_s: 321, propelente: MMH/MON, voo: "não conferido para o S400-15 (a lista de herança não separa o S400-12)", fonte: "[F28] p. 8: \"Specific Impulse at Nominal Point 321 s\" (catálogo de config/motores.yaml)"}
  - {motor: "LEROS 1c", isp_s: 324, propelente: MON/hidrazina, voo: "\"more than 60 engines delivered\" [F209]; entregues, voo não conferido", fonte: "[F209]: \"324 second Isp, MON/ Hydrazine dual mode apogee engine\""}
margem_sistema_jpl: {valor: 0.30, fonte: "[F210] p. 98 do PDF (impr. 4-18): \"system level mass ... was added in order to achieve a 30% margin as required by JPL Design Principles for a concept at this stage of development\" (margem de massa do sistema, não margem do lançador)"}
antes_etapa_4_5:   # linhas do config mudadas no portão da Etapa 4.5; as etapas antigas regeneram com os valores da época
  - arquivo: config/superficie.yaml
    procura: '^    circuito_fluido_kg: \{valor: [\d.]+, premissa: P-077\}$'
    troca: '    circuito_fluido_kg: {valor: 0, premissa: P-077}'
