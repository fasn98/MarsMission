# Decisões do Fabio no portão da Etapa 1.3 (2026-10-27). ADRs 0003 e 0004. Só o Fabio altera.
missao_referencia:
  id: 2028-conjuncao          # candidata A: partida 2028-11-23, chegada à Terra 2031-09-22
  orbita_marte: eliptica_alta # 1 sol, 250 × 33.793 km
  captura: propulsiva         # linha de base; aerocaptura só como opção comparada
envelope_dimensionamento:
  # Δv de projeto = maior Δv propulsivo total entre as conjunções das janelas de ida 2028–2035,
  # com a órbita e a captura da linha de base e respeitando o limite de reentrada (P-011).
  # O valor é calculado por tools/missoes.py; não é digitado aqui.
  janelas: ["2028", "2031", "2033", "2035"]
  classes: [conjuncao, conjuncao_transito_curto]
  orbita_marte: eliptica_alta
  captura: propulsiva
