# Dimensionamento por estágios (Etapa 1.4, Parte B). tools/dimensionamento.py.
# Fontes em docs/fontes.md; valores sem fonte direta = premissas NÃO VALIDADAS (config/premissas.yaml).

# Propelente por trecho — o MESMO em todas as variantes de envelope (decisão do Fabio, 2026-10-27):
#   saída da Terra: LOX/LH2 (criogênico), queima logo após o lançamento;
#   estágios de Marte (captura e retorno): MMH/MON (armazenável), propelente guardado ~3 anos
#   (a missão A dura 1033 d). Herança de voo: o motor de 400 N usado aqui voou na Mars Express
#   (2003) e no ExoMars Orbiter (2016) [F28], e o módulo de inserção do ERO usa "2 x 400 N" [F29].
estagios:
  saida_terra:
    propelente: LOX/LH2
    isp_s: {valor: 450.5, fonte: "[F27] ULA, Atlas V Launch Services User's Guide, rev. 11 (2010), p. 1-5 e A-13: RL10A-4-2, \"specific impulse of 450.5 seconds\""}
    fracao_estrutural:
      valor: 0.0972
      fonte: >
        [F27] mesmo guia, Fig. 1.4.1-3, p. 1-5: Centaur III de motor único, "Inert Mass: 4X1: 2,243 kg",
        "Propellant: 20,830-kg"; ε = 2243 / (2243 + 20830) = 0,0972 (calculado aqui). O guia não diz
        se o propelente é carregado ou utilizável.
  insercao_marte: &armazenavel
    propelente: MMH/MON
    # Motores escolhidos na Etapa 3.1 (ADR 0011): captura 8 × R-4D-11, retorno 4 × R-4D-11, variante do Orion.
    # Antes: 321 s do motor de 400 N [F28] (histórico em config/motores.yaml, antes_etapa_3_1).
    isp_s: {valor: 310, fonte: "[F107] p. 6 (Tab. 3): R-4D-11 do Orion, \"Specific Impulse 310 seconds\" (ADR 0011)"}
    fracao_estrutural:
      valor: 0.24
      fonte: >
        [F22] Yau (ESA) 2021, slide 8: módulo de inserção do ERO, "Dry Mass = 600 kg", "Prop Mass = 1900 kg";
        ε = 600 / 2500 = 0,24 (calculado aqui). Para comparar: o Fregat dá 0,12 [F30].
  retorno: *armazenavel
  marte_unico: *armazenavel   # variante (i): captura e retorno num só estágio

dv:
  # Perdas gravitacionais: diferença entre o Δv com perdas e o Δv ideal da missão de conjunção do DRA
  # 5.0 (Addendum, p. 211 [F18]): TMI 4,140 − 3,992; MOI 1,789 − 1,771; TEI 1,573 − 1,562 km/s.
  # São de outro veículo (empuxo/peso diferente); aplicá-las aqui é a premissa P-015 (NÃO VALIDADA).
  # Desde a Etapa 3.1 (ADR 0011), captura e saída de Marte usam a perda de queima finita calculada com os motores
  # escolhidos, em várias queimas (tools/redimensiona.py, ponto fixo com as massas); a P-015 fica para a saída da Terra
  # e para o histórico (config/motores.yaml, antes_etapa_3_1).
  perda_gravitacional:
    saida_terra: {valor: 0.148, premissa: P-015}
    captura_marte: {resultado: results/etapa3.1/perdas_calculadas.yaml, chave: perda_km_s.captura_marte}
    saida_marte: {resultado: results/etapa3.1/perdas_calculadas.yaml, chave: perda_km_s.saida_marte}
  correcao_trajetoria_por_trecho: {valor: 0.050, fonte: "[F18] DRA 5.0 Addendum, Tabela 5-15, p. 211: \"Mid-course corrections (m/s per leg) 50\""}
  atitude_cruzeiro_por_trecho: {valor: 0.015, fonte: "[F18] p. 211: \"Earth/Mars coast A/C (m/s) 15\" e \"Mars/Earth coast attitude control (m/s) 15\""}
  encontro_orbita_marte: {valor: 0.045, fonte: "[F18] p. 211: \"Mars orbit rendezvous with lander (m/s) 45\""}
  manutencao_orbita_marte: {valor: 0.100, fonte: "[F18] p. 211: \"Mars Orbit Maintenance (m/s) 100\""}
  desvio:
    # Δv de desvio do orbitador depois de soltar a cápsula (orbital.manobras.dv_desvio, plano B).
    gama_entrada_graus: {valor: -25, fonte: "[F24] Corliss & Edquist 2021, slide 27: ângulo de entrada da cápsula do MSR, −25°"}
    periapse_seguro_alt_km: {valor: 300, premissa: P-013}
    antecedencia_dias: {valor: 1, premissa: P-013}

margem_dv: {valor: 0.10, premissa: P-014}

# Plataforma do orbitador (estrutura do módulo de equipamentos, energia, térmico, comunicação, comando e dados,
# GNC, mecanismos, cabeamento): lista por subsistema da Etapa 2.3 (config/plataformas.yaml), margem E1 média do
# AIAA S-120A, na órbita de 300 × 24.992 km. Decisão do Fabio no portão da Etapa 2.3 (substitui os 850 kg).
# O valor é o calculado por tools/plataformas.py; tests/test_plataforma.py confere que os dois coincidem.
plataforma_orbitador_kg: {valor: 614.0, premissa: P-016}   # antes 496,5; carga de 1022 W (P-028, ADR 0015)

# Regra de projeto do envelope (ADR 0004, decisão do Fabio no portão da Parte B): variante (iii).
regra_projeto: iii_marte_pior_terra_ref

caso_base:
  carga_util: CU-2          # decisão do Fabio (portão da Parte A)
  acrescimo_capsula: 0.0    # faixa P-012 aplicada na sensibilidade

sensibilidade:
  carga_util: [CU-1, CU-2, CU-2b, CU-3]
  margem_dv: [0.0, 0.05, 0.10, 0.20]
  acrescimo_capsula: [0.0, 0.15, 0.30, 0.50]    # P-012
  delta_isp_relativo: [-0.05, 0.05]
  fracao_estrutural_multiplicador: [0.5, 1.5]
  plataforma_orbitador_kg: [331.8, 850, 2200]   # P-016: os dois análogos e o valor de base
