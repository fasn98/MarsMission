  periodo_conjuncao_graus: {valor: 5, fonte: "[F173] PDF p. 17 (impr. 4): \"Defined as the time period when the Sun–Earth–Mars angle is 5 deg or less\""}
  sem_telemetria_graus: {valor: 3, fonte: "[F174] PDF p. 121 (impr. 105): \"MER did not expect to depend on telemetry within a 3° SEP angle\""}
  sem_comando_graus: {valor: 2, fonte: "[F174] PDF p. 121 (impr. 105): \"and did not intend to command within 2°\""}
