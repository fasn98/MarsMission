# ---------------- portão da 4.3: comparação das saídas para a comunicação do lander (pedido do Fabio)
rele_proprio:   # (c) relé pelo nosso orbitador na órbita de encontro: simulação de passes
  # Perda de espaço livre por Friis: 20 log10(4π R f / c), com c [F31] e a frequência do canal 0 do retorno [F137].
  # A fórmula de [F177] p. 25, "PL(400 MHz) = 62 + 20 * log10(R(km)) (dB)" (e "89" a 8 GHz), fica cerca de 22 dB abaixo de
  # Friis nas duas frequências e não é usada (física acima de fonte: CLAUDE.md, regra 1).
  frequencia_mhz: {valor: 401.585625, fonte: "[F137] p. 81: \"Channel 0: 401.585625 MHz\""}
  limiares_dbm:   # receptor Electra do MRO, dados codificados, no conector da antena [F178] pPDF 21, Tab. 5.2-3
    fonte: "[F178] pPDF 21: \"Bit rate, kbps Threshold Power, dBm (coded) (at Antenna Connector) 1 -130.8 2 -127.8 4 -124.8 8 -121.8 16 -118.8 32 -115.8 64 -112.8 128 -109.7 256 -106.7 512 -103.3 1024 -99.6\""
    tabela: {1: -130.8, 2: -127.8, 4: -124.8, 8: -121.8, 16: -118.8, 32: -115.8, 64: -112.8, 128: -109.7, 256: -106.7, 512: -103.3, 1024: -99.6}
  potencia_tx_w: {valor: 5, premissa: P-066, fonte: "[F177] p. 24: \"UHF proximity radios typically utilize solid state power amplifiers (SSPAs) that generate between 5-10 watts\" (limite inferior)"}
  ganhos_antenas_dbi: {valor: 0, premissa: P-066}   # soma dos ganhos das duas antenas; os ganhos só aparecem em figuras
  margem_db: {valor: 3, premissa: P-066}
  elevacao_min_graus: {valor: 10, fonte: "[F137] p. 33: \"Both figures have the required 10-deg minimum elevation angle to MRO\""}
  consumo_transmitindo_w: {valor: 69, fonte: "[F137] p. 87: \"about 69 W when transmitting\""}
  inclinacao_graus: {valor: 30, premissa: P-067}
  sois_simulados: {valor: 60, premissa: P-067}
  passo_s: {valor: 30, premissa: P-067}
  sitio: {latitude_graus: 18.4663, longitude_graus: 77.4298, fonte: "[F172]: \"Perseverance landed on Jezero crater [18.4663° N,77.4298° E]\""}
  conferencia_orbita_baixa:   # o mesmo modelo numa órbita circular baixa, contra o desempenho publicado do MRO com o MSL
    altitude_km: {valor: 250, fonte: "[F177] p. 25: \"MRO, which is in a circular orbit with an altitude of about 250 km\""}
