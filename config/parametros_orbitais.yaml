  fonte: "[F10] gm_de440.tpc, BODY399_GM (valor DE440)"
gm_marte:
  valor: 42828.37362069909
  unidade: km^3/s^2
  fonte: >
    [F10] gm_de440.tpc, BODY499_GM. O cabeçalho do arquivo diz que só os corpos 1–10, 199,
    299, 301 e 399 foram ajustados à DE440; o 499 vem de gm_Horizons.pck (nov/2022).
raio_terra_km:
