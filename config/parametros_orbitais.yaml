leo_altitude_km:
  valor: 407
  fonte: >
    [F18] DRA 5.0, NASA/SP-2009-566, p. 22: "all vehicles depart from a 407-km circular orbit".
    Mesmo valor do manual da Etapa 1.2 [F13].
orbitas_marte:
  circular_baixa:
    descricao: circular de 500 km
    periapse_alt_km: {valor: 500, fonte: "[F18] DRA 5.0, SP p. 54: alvo do estudo de aerocaptura, \"500-km circular orbit\""}
    apoapse_alt_km: {valor: 500, fonte: "idem"}
  eliptica_alta:
    descricao: elíptica de 1 sol, 250 × 33.793 km
    periapse_alt_km: {valor: 250, fonte: "[F18] DRA 5.0, SP p. 22: \"1-sol orbit (250 km × 33,793 km)\""}
    apoapse_alt_km: {valor: 33793, fonte: "idem"}
aerocaptura_periapse_alt_km:
  valor: 50
  status: NÃO VALIDADA
  premissa: P-010
  fonte: >
    DRA 5.0 Addendum #2 [F18], Tabela 2-7, pp. 46–48, dá "Minimum periapsis altitude for
    Aerocapture 50 km": é um limite mínimo, não a altitude de projeto da passagem.
interface_reentrada_alt_km:
  valor: 121.92
  fonte: >
    [F19] Graves & Harpold, NASA TN D-6725 (1972), p. 8: "This interface is defined as an
    altitude of 400 000 feet above the surface of the earth" (400.000 ft = 121,92 km).
reentrada_max_km_s:
