# Etapa 2.2b — propulsão do MAV (tools/mav_propulsao.py). Todas as opções sem ISRU (ADR 0006).
# Todas com dois estágios e a mesma divisão de Δv (P-019); carga útil de 16 kg [F34].
opcoes:
  O1:
    nome: Sólido (como o MSR)
    isp_s: [293, 282]
    isp_fonte: "[F34] Jackman et al. 2019, p. 4: Isp médio de 293 e 282 s"
    fracao_estrutural: {valor: 0.286, fonte: "[F34] p. 4: 394 kg, 216 + 54 kg de propelente, 16 kg de carga; ε = 108/378 (veículo inteiro, calculado aqui; P-019)"}
    criogenico: false
  O4:
    nome: Hipergólico armazenável (MMH/NTO)
    # Motores escolhidos na Etapa 3.1 (ADR 0011): estágio 1 = 4 × R-4D-11 (M2), estágio 2 = 1 × R-4D-11 (N2), Isp de voo
    # da variante do Orion. Antes: 343 s do motor com turbobomba de Bowles et al. [F46] (histórico em config/motores.yaml).
    isp_s: [310, 310]
    isp_fonte: "[F107] p. 6 (Tab. 3): R-4D-11 do Orion, \"Specific Impulse 310 seconds\" (ADR 0011)"
    # Desde 2026-10-28 (decisão do Fabio, ADR 0007, nota): ε do MAV PRESSURIZADO de Bowles, coerente com os motores
    # pressurizados (R-4D-11). Antes: 0,238 do MAV com turbobomba (histórico em config/motores.yaml, antes_etapa_3_1).
    fracao_estrutural:
      valor: 0.230
      fonte: >
        [F46] Tab. 5, p. 30, coluna "Pressure Feed": MAV hipergólico pressurizado, 20 kg de carga, "Dry Mass 65.5 kg",
        "Propellant Fraction 73.1%", "GLOW 394.1 kg". Mesmo método do 0,238: o que não é carga, seco nem propelente útil
        entra como inerte, ε = (394,1 − 20 − 0,731 × 394,1)/(394,1 − 20) = 0,230 (calculado aqui). A massa seca inclui a
        reserva de crescimento: p. 5, "A weight growth allowance of 30% was used for all dry mass elements"; cada "% Dry"
        da Tab. 5 é a massa do item dividida por 65,5/1,3 = 50,4 kg (calculado aqui); e a p. 38 (§9.0 e §9.1) diz que a coluna
        "Inert" da Tab. 11 é o projeto final do MAV pressurizado de 20 kg ("the pressure-feed 20kg inert payload mass MAV
        design"; 392,6 kg, contra 394,1 kg na Tab. 5), com (Tab. 11, p. 40) "Contingency 14.93 (30%)" dentro dos 64,72 kg secos.
      sensibilidade:
        pessimista: {valor: 0.238, fonte: "[F46] Tab. 5, p. 30, coluna \"Pump Feed\": 54,0 kg secos, 71,3 %, 312,5 kg; ε = 69,7/292,5 (calculado aqui)"}
        otimista: {valor: 0.176, fonte: "[F46] Tab. 11, p. 40, coluna \"Inert\": \"Dry Mass, kg\" 64.72, \"Propellants, kg\" 303.88; ε = seco/(seco + propelente) = 64,72/368,60 (calculado aqui). Mesmo veículo do 0,230, contado de outro jeito: p. 38, \"Total propellant mass fraction is 77.4%, which includes ascent propellant, reserves and engine start-up\"; contar reserva (5 %, p. 4) e partida como propelente equivale a tirar a reserva do MAV"}
        ilustracao_risco: {valor: 0.30, premissa: P-045}
    criogenico: false
  O2:
    nome: LOX/CH4, tudo da Terra
    isp_s: [370, 370]
    isp_fonte: "[F46] p. 32: \"approximately 370 seconds for the methane/liquid oxygen combination\""
    fracao_estrutural: {valor: 0.295, premissa: P-021}
    razao_of: {valor: 3.5, fonte: "[F18] DRA 5.0 Addendum, p. 105"}
    criogenico: true

cruzeiro:
  # Armazenamento sem evaporação no cruzeiro (O2): DRA 5.0 ADD2, Tab. 4-30, coluna de trânsito (só LCH4; o DRA leva
  # os tanques de LOX vazios). Escalado com expoente 2/3 a partir do CH4 do MAV do DRA (6567 kg [F18]); aplicado
  # ao CH4 e ao LOX (P-026).
  zbo_transito: {potencia_w: 745, massa_ativa_kg: 71, massa_passiva_kg: 161, referencia_kg: 6567, expoente: 0.6667,
                 fonte: "[F51] Tab. 4-30, p. 241 (imagem conferida): Transit/HEO, 31 W de carga, 3 cryocoolers, 71 kg ativos, 161 kg passivos, 745 W"}
  duracao_dias: 300   # ida da missão A (Etapa 1.3)
  solar_w_kg_1ua: {valor: 80, fonte: "[F55] JPL D-101316 (2017), p. 26: \"Beginning-of-life specific power … at 1 AU is typically up to ~80 W/kg\""}
  distancia_marte_ua: {valor: 1.5236915, fonte: "[F56] Appelbaum & Flood, NASA TM-102299 (1989): semieixo de Marte 1,5236915 UA"}

aquecimento:
  # Aquecimento do MAV na superfície durante a estada (O1 e O4; o O2 já tem o armazenamento criogênico).
  # Referência: aquecedores do 1º motor do MAV do MSR, DAC-0.0 [F57], Fig. 5, p. 4: 2 + 25 + 9 W para manter
  # −25 a −15 °C (média −20 °C); ambiente de −62,5 °C (p. 8); 320 kg de propelente no SRM1 (p. 3).
  # P = P_ref · (ΔT / ΔT_ref) · (m_prop / m_ref)^(2/3)  (P-027)
  referencia_w: {valor: 36, fonte: "[F57] Fig. 5, p. 4 (imagem conferida): 2 W, 25 W e 9 W"}
  t_referencia_c: {valor: -20, fonte: "[F57] p. 4: \"AFT range of -25°C to -15°C\""}
  t_ambiente_c: {valor: -62.5, fonte: "[F57] p. 8: \"exposed to a minimum of -62.5°C while stowed within the igloo of the SRL\""}
  m_prop_referencia_kg: {valor: 320, fonte: "[F57] p. 3: \"SRM1 featured 320kg of propellant\""}
  expoente_area: {valor: 0.6667, premissa: P-027}
  t_minima_c:
    O1: {valor: -40, fonte: "[F57] p. 8: \"AFT greater than -40°C during non-operational phases\""}
    # Antes −1 °C (NTO congela a −11 °C [F61] + 10 K de margem, P-027). Decisão do Fabio no portão da 4.2: a faixa de entrada
    # do R-4D-11 não foi achada na ficha [F106], na Tab. 3 do Orion ESM [F107] nem na ficha da Aerojet (só pressões e o Isp a 70 °F); vale o limite inferior
    # da faixa nominal de sistemas MMH/NTO.
    O4: {valor: 15, premissa: P-027, fonte: "[F159] p. 2: \"Such systems have been operated with nominal propellant temperature between ~15oC [60oF] and ~27oC [80oF]\""}
