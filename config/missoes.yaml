# Busca de missões completas (tools/missoes.py). Datas TDB.
passo_dias: 2

# Trajetória escolhida em cada janela/classe pelo menor Δv propulsivo neste caso. Os Δv dos
# outros casos (outra órbita, com/sem aerocaptura) são calculados para a MESMA trajetória.
criterio_selecao:
  orbita_marte: eliptica_alta
  aerocaptura: false

classes:
  oposicao:
    # [F18] DRA 5.0, SP p. 47: "short surface stay times at Mars (typically 30 to 90 days)
    # and relatively short total round-trip mission times (500 to 650 days)".
    permanencia_dias: [30, 90]
    duracao_max_dias: 650
  conjuncao:
    # Faixa de busca (premissa P-009, NÃO VALIDADA). DRA 5.0, SP p. 47: "500 days or more";
    # p. 48: "475 to 540 days" para as soluções que o DRA apresenta.
    permanencia_dias: [400, 700]
  conjuncao_transito_curto:
    # Igual à conjunção, com trânsitos limitados como no DRA 5.0, SP p. 47: "relatively short
    # transits to and from Mars (less than 180 to 210 days)". Usado o limite superior, 210 d.
    permanencia_dias: [400, 700]
    tof_max_dias: 210

# Domínios: partida da Terra = janelas de ida da Etapa 1.2 (config/janelas.yaml); datas em
# Marte e chegada à Terra cobrem as estadas curtas e as janelas de retorno da Etapa 1.2.
janelas:
  "2028": {partida_terra: ["2028-09-15", "2029-02-28"], datas_em_marte: ["2029-01-01", "2031-04-30"], chegada_terra: ["2029-06-01", "2032-03-31"]}
  "2031": {partida_terra: ["2030-11-01", "2031-05-15"], datas_em_marte: ["2031-03-01", "2033-06-30"], chegada_terra: ["2031-09-01", "2034-04-30"]}
  "2033": {partida_terra: ["2033-01-01", "2033-07-31"], datas_em_marte: ["2033-05-01", "2035-09-30"], chegada_terra: ["2033-10-01", "2036-09-30"]}
  "2035": {partida_terra: ["2035-03-15", "2035-10-15"], datas_em_marte: ["2035-07-01", "2037-12-31"], chegada_terra: ["2036-01-01", "2038-12-31"]}
