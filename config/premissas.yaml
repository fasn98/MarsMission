      [F148]. O erro na atividade é muito menor que a distância ao limite do Tier I. Só a massa de Pu-238 [F135] entra
      na conta; os outros isótopos do combustível não, o que subestima um pouco a atividade.
    status: NÃO VALIDADA
  - id: P-059
    nome: fator_do_opportunity_nas_tempestades
    valor: {aplicado_a: "cenários de tempestade (τ ≥ 2) e sobrevivência", tau_da_comparacao: 2.1}
    unidade: adimensional
    uso: tools/energia.py (sensibilidade das áreas de painel)
    justificativa: >
      Em τ = 2,1 o modelo de insolação dá razão de energia maior que a medida pelo Opportunity em 2018 [F140]
      (results/etapa4.1/energia.md). Na sensibilidade pedida pelo Fabio no portão da Etapa 4.1, a energia por m² dos
      cenários de tempestade é dividida por esse fator (razão do modelo / razão medida), igual para todo τ. O fator vem de um
