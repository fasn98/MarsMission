  - id: P-037
    nome: saida_propria_fora_do_plano
    valor: {orbita_baixa_km: 407, inclinacoes_com_dado_graus: [28.5, 51.6]}
    unidade: km; graus
    uso: tools/lancamento.py — opção (b), órbita baixa + estágio criogênico próprio
    justificativa: >
      Capacidade de LEO publicada a 400 km (ELVPerf [F79], Atlas V [F27]) usada para a órbita de 407 km do modelo
      (diferença de 7 km desprezada). A órbita baixa é a de 28,5° ou a de 51,6° (as inclinações com dado); quando
      |DLA| passa da inclinação, a assíntota precisa sair β = |DLA| − i do plano, e a própria queima de saída, num
      impulso único no perigeu, gira o plano em torno do vetor posição: θ = arcsin(sen β / sen ν∞), com
      ν∞ = arccos(−1/e) ≈ 150°, ou seja, θ ≈ 2β (correção da revisão independente; a primeira versão usava θ = β e
      subestimava o custo). Δv pela lei dos cossenos entre a velocidade circular e a do perigeu da hipérbole.
      Estratégias com mais de um impulso, ou um lançamento direto à inclinação da DLA, podem custar menos; não foram
      avaliadas. O estágio de saída é redimensionado para o C3 e a DLA de cada janela (pedido do Fabio no portão
      da Etapa 2.4). Aprovada pelo Fabio no portão da Etapa 2.4 como premissa (continua NÃO VALIDADA).
