    unidade: adimensional
    uso: tools/energia.py (opção C, carga de sobrevivência na tempestade)
    justificativa: >
      Carga de sobrevivência do lander na tempestade global = aquecimento do MAV (modelo atual) + aquecedores do
      Spirit no inverno de 2008 (84 Wh/sol [F141]) mais o calor das 8 RHUs de 1 W da caixa eletrônica do MER [F142],
      que o lander, sem material nuclear, repõe com aquecedores elétricos, escalados por (massa da plataforma do lander / 174 kg [F142])^(2/3),
      como perda térmica proporcional à área, + a eletrônica mínima do Spirit (140 Wh/sol [F141]) sem escala.
      Pedida pelo Fabio no portão da Etapa 4.1. O Spirit estava em Gusev, no inverno, com aquecedores de instrumento e de
      bateria; o lander é outro veículo, em outra latitude e estação, e a tempestade aquece as noites. Sensibilidade com
      escala linear na massa (expoente 1). Na sobrevivência não há cargas de pico (a comunicação está nos 140 Wh).
    status: NÃO VALIDADA
  - id: P-057
    nome: razao_de_energia_do_opportunity_em_2018
    valor: {tau_alto: 10.8, tau_referencia: 0.64}
    unidade: adimensional
    uso: tools/energia.py (sobrevivência da opção C acima de τ = 6)
    justificativa: >
      Acima de τ = 6 o modelo de insolação não vale [F130]. Usa-se a razão medida pelo Opportunity entre a energia do
      sol 5111 (τ = 10,8, ~22 Wh) e a do sol 5100 (τ = 0,64, 652 Wh) [F140], aplicada à energia por m² do lander em
      Jezero com τ = 0,64 no pior sol da estada. Supõe-se que a razão não dependa da latitude, da estação, da inclinação
      do painel e da poeira (o fator de poeira do sol 5111 não foi publicado; o do sol 5100 é 0,772). A data do sol 5100
      sai do sol 5106 (04/06/2018) menos 6 sóis. A duração da fase com τ > 6 e a ponte pela bateria não são avaliadas.
    status: NÃO VALIDADA
  - id: P-058
