      análogo da P-032 não o detalha; margem de crescimento da categoria de eletrônica. Sem fonte própria.
      Massa: todos os itens do "Rover X-band" do MSL [F137] Tab. 2-11. Energia: SSPA e transponder transmitindo no passe;
