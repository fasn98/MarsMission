# Premissas do estudo: todo valor usado sem fonte primária publicada.
# Regra: só o Fabio altera o campo "status". Valores possíveis: "NÃO VALIDADA", "ACEITA PELO FABIO".
premissas:
  - id: P-001
    nome: tolerancia_efemeride_vs_horizons_km
    valor: 1.0
    unidade: km
    uso: tests/test_ephemeris.py — tolerância de posição entre DE440 (local) e Horizons (DE441)
    justificativa: >
      Escolhida para detectar erros de pipeline: escala de tempo errada (UTC em vez de
      TDB, ~69 s x ~24 km/s ~ 1600 km), frame eclíptico em vez de equatorial (~1e8 km)
      e unidade errada. Diferença observada em 2026-10-26: < 0,1 m (ver
      docs/etapa1.1_efemerides.md). Não há valor publicado para essa tolerância.
    status: NÃO VALIDADA
  - id: P-002
    nome: tolerancia_velocidade_vs_horizons_km_s
    valor: 1.0e-6
    unidade: km/s
    uso: tests/test_ephemeris.py — tolerância de velocidade entre DE440 (local) e Horizons (DE441)
    justificativa: Idem P-001.
    status: NÃO VALIDADA
  - id: P-003
    nome: tolerancia_lambert_vs_kepler_rel
    valor: 1.0e-10
    unidade: adimensional (erro relativo de posição e velocidade)
    uso: tests/test_lambert.py — solução de Lambert propagada por Kepler analítico (variável universal)
    justificativa: >
      Folgada em relação ao pior caso observado em 2026-10-27 (6,2e-12 em 850 casos, M = 0, 1, 2,
      incluindo órbitas de periapse baixa; nenhum caso excluído). Sem valor publicado.
    status: NÃO VALIDADA
  - id: P-004
    nome: tolerancia_kepler_vs_integrador_rel
    valor: 1.0e-8
    unidade: adimensional (erro relativo de posição)
    uso: tests/test_kepler.py — propagação analítica comparada com integração numérica (DOP853, rtol 1e-13)
    justificativa: >
      Folgada em relação ao pior caso observado em 2026-10-27 (4,1e-10 em 100 órbitas elípticas e
      hiperbólicas). O limite é dado pelo integrador, não pela solução analítica. Sem valor publicado.
    status: NÃO VALIDADA
  - id: P-005
    nome: tolerancia_lambert_vs_referencia_km_s
    valor: 1.0e-8
    unidade: km/s (maior diferença por componente)
    uso: tests/test_lambert.py — comparação com os testes oficiais do valladopy
    justificativa: >
      Diferença observada em 2026-10-27: 2,5e-9 km/s em todos os casos. É a mesma ordem da
      diferença entre os dois métodos do próprio autor (Battin e universal) no mesmo arquivo de
      testes (p. ex. −6,241103309400 e −6,241103311950 km/s). Sem valor publicado.
    status: NÃO VALIDADA
  - id: P-006
    nome: exclusao_angulo_180_graus
    valor: 1.0
    unidade: graus
    uso: tools/porkchop.py e tools/verifica_burke2010.py — busca do mínimo de C3 por tipo
    justificativa: >
      Perto de 180° o plano da transferência de Lambert fica mal definido e a classificação
      tipo I/II é ambígua. Sem exclusão, o mínimo "tipo II" de 2035 (partida no centro da Terra)
      caiu em 180,0° (C3 = 17,29 km²/s², 10/05/35 → 19/12/35), fora da bacia que o manual
      NASA/TM-2010-216764 reporta. O manual não diz como trata esse caso. Valor sem fonte.
    status: NÃO VALIDADA
  - id: P-007
    nome: tolerancia_burke2010_rel
    valor: 0.002
    unidade: adimensional (erro relativo de C3 e de v∞ de chegada)
    uso: tests/test_porkchop.py — C3 e v∞ nas datas impressas em NASA/TM-2010-216764, janelas 2028–2033
    justificativa: >
      O manual imprime 3 a 4 algarismos significativos e usa grade de 2 dias. Com partida no
      baricentro Terra–Lua, os erros observados em 2026-10-27 foram ≤ 0,07 % (C3) e ≤ 0,03 %
      (v∞). 2035 fica fora do teste: as datas da Tabela 6 do manual parecem deslocadas cerca de
      63 dias (docs/etapa1.2_lambert_porkchop.md). Valor sem fonte.
    status: NÃO VALIDADA
  - id: P-008
    nome: tolerancia_jpl8243_rel
    valor: 0.002
    unidade: adimensional (erro relativo de C3L e de VHP)
    uso: tests/test_retorno.py — C3L e VHP nas datas impressas no JPL 82-43 Parte 5, 1992–2007
    justificativa: >
      As tabelas imprimem 3 decimais e datas inteiras. Efeito da efeméride (DE-118, representada
      pela DE200, contra a DE440) medido em ≤ 1,5e-5 (results/etapa1.2/efeito_efemeride_de200.yaml).
      Erros observados em 2026-10-27, com chegada no baricentro Terra–Lua: ≤ 0,09 %, fora as três
      linhas tratadas à parte em docs/etapa1.2_retorno.md. Valor sem fonte.
    status: NÃO VALIDADA
  - id: P-009
    nome: conjuncao_permanencia_busca_dias
    valor: [400, 700]
    unidade: dias
    uso: config/missoes.yaml, classes conjuncao e conjuncao_transito_curto (faixa de busca)
    justificativa: >
      O DRA 5.0 (SP p. 47) descreve a conjunção como "500 days or more" e mostra soluções com
      475–540 dias (p. 48). A faixa de busca é mais larga para que o mínimo de energia de cada
      janela não seja cortado pela definição; a permanência resultante é reportada.
    status: NÃO VALIDADA
  - id: P-010
    nome: aerocaptura_periapse_altitude_km
    valor: 50
    unidade: km
    uso: config/parametros_orbitais.yaml — periapse da passagem atmosférica em Marte
    justificativa: >
      O DRA 5.0 Addendum #2 (Tabela 2-7) dá 50 km como altitude MÍNIMA de periapse para
      aerocaptura, não como valor de projeto. No modelo ideal, a elevação de periapse depois da
      passagem fica maior quanto mais baixo for o periapse, então 50 km tende a superestimar esse Δv.
    status: NÃO VALIDADA
  - id: P-011
    nome: reentrada_max_km_s
    valor: 12.9
    unidade: km/s (velocidade inercial na interface de reentrada)
    uso: config/parametros_orbitais.yaml — limite na busca de missões (tools/missoes.py)
    justificativa: >
      Decisão do Fabio (portão da Etapa 1.3, 2026-10-27): usar a maior reentrada já feita, a da
      cápsula Stardust. Fonte: Desai, Lyons, Tooley & Kangas, "Entry, Descent, and Landing
      Operations Analysis for the Stardust Re-Entry Capsule", AIAA/AAS (NTRS 20060028186): "The
      inertial entry velocity and flight-path angle for Stardust were 12.9 km/s and –8.2 deg". A
      fonte não declara a altitude da interface. O valor é um precedente de voo, não um limite
      de projeto para a cápsula deste estudo.
    status: NÃO VALIDADA
  - id: P-012
    nome: acrescimo_massa_capsula_faixa
    valor: [0.0, 0.15, 0.30, 0.50]
    unidade: fração da massa da cápsula com amostras (89,9 kg na CU-2)
    uso: config/dimensionamento.yaml — sensibilidade da massa na órbita baixa
    justificativa: >
      A cápsula do MSR foi projetada para 12,0 km/s [F24]; a missão A reentra a 12,34 km/s. Não há
      fonte para a massa de uma cápsula mais rápida, então não se usa lei de escala: aplica-se uma faixa
      de acréscimo (0 a 50 %) só para mostrar o efeito na massa total (decisão do Fabio, 2026-10-27).
    status: NÃO VALIDADA
  - id: P-013
    nome: desvio_orbitador_parametros
    valor: {periapse_seguro_alt_km: 300, antecedencia_dias: 1}
    unidade: km; dias
    uso: config/dimensionamento.yaml — Δv de desvio do orbitador após soltar a cápsula (plano B)
    justificativa: >
      O orbitador precisa sair da trajetória de entrada da cápsula (γ = −25° [F24]) para uma passagem com
      periapse seguro. Com 1 dia de antecedência, a aproximação linear do plano B dá ~19 m/s para a
      missão A; com 2 dias, ~9 m/s. Para comparar: a Stardust soltou a cápsula 4 h antes da entrada
      [F20], caso em que a aproximação linear não vale. Valores sem fonte direta.
    status: NÃO VALIDADA
  - id: P-014
    nome: margem_dv
    valor: 0.10
    unidade: fração, aplicada a todos os trechos
    uso: config/dimensionamento.yaml
    justificativa: >
      Cobre o que não está modelado: perdas de queima finita com motor de baixo empuxo (2 × 400 N na
      arquitetura do ERO), mudança de plano por DLA (Fase 2), dispersões de navegação e a diferença entre
      o Δv impulsivo e o real. Sem valor publicado aplicável a este veículo.
    status: NÃO VALIDADA
  - id: P-015
    nome: perdas_gravitacionais_do_dra
    valor: {saida_terra: 0.148, captura_marte: 0.018, saida_marte: 0.011}
    unidade: km/s
    uso: config/dimensionamento.yaml
    justificativa: >
      Diferenças entre o Δv com perdas e o ideal do DRA 5.0 (Addendum, p. 211 [F18]) para um veículo
      tripulado com outra relação empuxo/peso. Usadas como ordem de grandeza; o valor real depende do
      empuxo deste veículo, que não foi definido.
    status: NÃO VALIDADA
  - id: P-016
    nome: plataforma_orbitador_kg
    valor: 442.3
    faixa: [422, 510]
    unidade: kg (massa seca prevista da plataforma, sem módulos propulsivos e sem carga útil)
    uso: config/dimensionamento.yaml
    justificativa: >
      Etapa 2.3 (decisão do Fabio no portão, 2026-10-27): lista por subsistema com análogo do Mars Odyssey [F33],
      energia dimensionada para o afélio e o pior eclipse na órbita de 300 × 24.992 km, cabeamento de 5 % da
      plataforma [F71], margem de crescimento no ponto médio da categoria E1 do AIAA S-120A [F70]. Básica 354,1 kg;
      prevista 442,3 kg. Faixa: E1 mínimo (422) a ESA 20 % × 20 % (510). Depende das premissas P-028 a P-031 e
      P-033. Histórico: até a Etapa 2.2 valia 850 kg (média geométrica de Odyssey 331,8 kg [F33] e ERO 2200 kg [F22]).
    status: NÃO VALIDADA
  - id: P-017
    nome: plataforma_superficie_kg
    valor: 1558.5
    faixa: [529, 2500]
    unidade: kg (massa pousada sem o MAV e sem o bloco de aquecimento do MAV)
    uso: config/superficie.yaml — massa pousada = MAV + plataforma de superfície
    justificativa: >
      Etapa 2.3 (decisões do Fabio no portão, 2026-10-27). Base = L3 + amostras.
      L3: análogo da mesma classe, o Sample Retrieval Lander do MSR: até 2100 kg secos na superfície [F77] menos o
      MAV de 400 kg [F35] e o rover de busca de < 230 kg [F78] = 1470 kg (limite inferior dessa conta, porque o SFR é
      "< 230 kg"); valor de alocação, sem margem adicional. Cobre ao menos parte do sistema de lançamento e ereção do
      MAV (MLS), sem massa publicada; os itens próprios do MSR são incerteza declarada.
      Amostras: item da P-034 (59 kg, MGA E1 de 50 % = 88,5 kg) somado como ALOCAÇÃO PROVISÓRIA; o conceito de coleta
      e o objetivo científico ficam para a Etapa 2.5. Total de base 1558,5 kg; GSFC 1787,9 kg; ESA 2201,8 kg.
      Faixa: limite inferior L1 = núcleo do Phoenix sem escala (529 kg); limite superior = SRL de 2024 menos o MAV,
      2900 − 400 = 2500 kg [F41][F35], COMPARABILIDADE NÃO CONFIRMADA (a fonte fala em carga pousada, não em massa
      seca). L2 (1857 kg) fica só como referência. Histórico: até a Etapa 2.2 valia 850 kg (média geométrica de
      Phoenix e SRL); no primeiro portão da 2.3, 1470 kg (L3 sem amostras).
    status: NÃO VALIDADA
  - id: P-018
    nome: razao_massa_pousada_entrada
    valor: {entrada_direta: 0.509, a_partir_de_orbita: 0.624}
    unidade: adimensional (massa pousada / massa de entrada)
    uso: config/superficie.yaml — massa do sistema de entrada, descida e pouso
    justificativa: >
      Entrada direta: SRL de 2024, 5700 kg de entrada a 5,4 km/s e ~2900 kg pousados [F41]. A partir de
      órbita: Viking, 980 kg de entrada e 612 kg pousados (Way et al. 2006, Tabela 1 [F42]), com entrada a
      ~4,6 km/s [F43]. Aplicar essas razões a outras massas e velocidades de entrada é extrapolação.
    status: NÃO VALIDADA
  - id: P-019
    nome: mav_estagios
    valor: {fracao_estrutural: 0.286, fracao_dv_estagio_1: 0.481}
    unidade: adimensional
    uso: config/superficie.yaml — dimensionamento do MAV sólido de dois estágios
    justificativa: >
      Do MAV sólido de 2019 [F34]: 394 kg ao todo, 16 kg de carga útil, 216 + 54 kg de propelente; o inerte
      total (108 kg, inclui aviônica e estrutura) dá ε = 108/378 = 0,286 para o conjunto. A divisão por
      estágio não é publicada; supõe-se o mesmo ε nos dois. Com isso, a fração do Δv do 1º estágio
      calculada para aquele projeto é 0,481. Valores derivados com hipótese de divisão igual.
    status: NÃO VALIDADA
  - id: P-020
    nome: aerofrenagem_orbitador
    valor: {dv_saida_km_s: 0.090, duracao_dias: 205}
    unidade: km/s; dias
    uso: config/superficie.yaml — arquitetura S4
    justificativa: >
      Valores do estudo de arquitetura do ERO (Joffre et al., Airbus/ESA [F44], pp. 9–10), para descer de
      uma órbita de 1 sol até ~300 km com coeficiente balístico de 50 kg/m² e pressão dinâmica de pico de
      0,5 N/m². O coeficiente balístico deste orbitador não foi calculado; aplicar esses valores é extrapolação.
      A aerofrenagem já foi feita em voo em Marte (o próprio estudo toma o TGO como referência de cenário).
    status: NÃO VALIDADA
  - id: P-021
    nome: mav_loxch4_fracao_estrutural
    valor: 0.295
    unidade: adimensional (por estágio, MAV de dois estágios)
    uso: config/mav_propulsao.yaml (O2) e config/isru.yaml (Etapa 2.2)
    justificativa: >
      REVISADA no portão da 2.2 (2026-10-27): usar no LOX/CH4 a fração do sólido não era conservador. Não há
      estágio LOX/CH4 pequeno publicado. Estimativa: ε do MAV hipergólico pequeno de Bowles et al. (Tab. 5,
      turbobomba, carga de 20 kg: 0,238 [F46]) multiplicado pela razão LOX/CH4 ÷ hipergólico na mesma missão
      (Tab. 9: 0,150/0,121 = 1,24; Bowles, p. 32: massa seca maior "due to higher surface area and required
      cryogenic tank insulation"). Resultado: 0,295. Derivado; sem estágio voado nessa escala.
    status: NÃO VALIDADA
  - id: P-022
    nome: escala_planta_moxie
    valor: {expoente_massa: 1.0, expoente_potencia: 1.0}
    unidade: adimensional
    uso: config/isru.yaml — planta de O2 da opção O3
    justificativa: >
      Extrapolação linear do MOXIE (17,8 kg, ~300 W, 6 g/h [F48]) para a taxa necessária. É conservadora:
      Hecht et al. (p. 71) dizem que só o compressor deve escalar com a capacidade, e a planta do DRA
      (945 kg, 26,08 kW para 24.891 kg em 300 sols [F18]) é ~10 vezes mais leve por kg/h. A escala do DRA entra
      como limite inferior na sensibilidade. Nenhuma planta acima da escala do MOXIE voou.
    status: NÃO VALIDADA
  - id: P-023
    nome: escala_liquefacao_o2
    valor: 1.0
    unidade: adimensional
    uso: config/isru.yaml — liquefação de O2 (O3)
    justificativa: >
      Massa e potência da liquefação em linha de Johnson et al. (106,5 kg, 3570 W a 2,2 kg/h [F49]) escaladas
      linearmente com a taxa. Abaixo dessa taxa, a massa de cryocoolers não cai necessariamente na mesma
      proporção.
    status: NÃO VALIDADA
  - id: P-024
    nome: escala_armazenamento_zbo
    valor: 0.6667
    unidade: adimensional (expoente sobre a massa armazenada)
    uso: config/isru.yaml — armazenamento sem evaporação na superfície (O2 e O3)
    justificativa: >
      A carga térmica cresce com a área do tanque, ~ (massa)^(2/3). Referência: Tab. 4-31 do DRA 5.0
      Addendum #2 [F51] (tanques cheios de um MAV humano), com as massas de propelente do MAV do DRA 5.0
      Addendum, Tab. 3-18 [F18]. Os dois documentos podem descrever MAVs diferentes. O armazenamento
      durante o cruzeiro Terra–Marte não é modelado.
    status: NÃO VALIDADA
  - id: P-025
    nome: escala_energia_solar
    valor: 1.0
    unidade: adimensional
    uso: config/isru.yaml — massa de painéis solares
    justificativa: >
      Massa do módulo solar do DRA (1980 kg para 5 kWe contínuos, com armazenamento noturno [F18]) escalada
      linearmente com a potência. Não inclui tempestades de poeira longas (o DRA estima +7800 kg para 50 dias,
      p. 123) nem a latitude de Jezero.
    status: NÃO VALIDADA
  - id: P-026
    nome: armazenamento_cruzeiro
    valor: {referencia_kg: 6567, expoente: 0.6667}
    unidade: kg; adimensional
    uso: config/mav_propulsao.yaml — armazenamento sem evaporação de LOX e CH4 no cruzeiro (O2)
    justificativa: >
      A única fonte primária para trânsito é a Tab. 4-30 do DRA 5.0 ADD2 [F51]: só CH4, MAV humano, com fator
      de correção de carga térmica de 2,1. Escalada com área ~ massa^(2/3) a partir do CH4 do MAV do DRA, e
      aplicada também ao LOX. Não há fonte primária para tanques dentro de um aeroshell no cruzeiro nem
      para evaporação passiva em trânsito. O maior resfriador de 90 K já voado entrega 20 W [F50].
    status: NÃO VALIDADA
  - id: P-027
    nome: aquecimento_mav_superficie
    valor: {expoente_area: 0.6667, margem_congelamento_k: 10}
    unidade: adimensional; K
    uso: config/mav_propulsao.yaml — aquecimento do MAV sólido (O1) e hipergólico (O4) durante a estada
    justificativa: >
      Única referência numérica: aquecedores do 1º motor do MAV do MSR, 36 W para manter −20 °C num ambiente
      de −62,5 °C, com 320 kg de propelente [F57]. Escala linear com ΔT (condução) e com a área ~ massa^(2/3).
      Para o hipergólico, mínimo de −1 °C (NTO congela a −11 °C [F61], + 10 K de margem). Aquecimento
      contínuo durante toda a estada, sem uso do calor residual de um MMRTG. Sem fonte para essa escala.
    status: NÃO VALIDADA
  - id: P-028
    nome: carga_eletrica_orbitador_w
    valor: 510
    unidade: W (mesma carga no sol e no eclipse)
    uso: config/plataformas.yaml — painel e bateria do orbitador
    justificativa: >
      Soma de dois análogos: barramento do Mars Express no modo de comunicação, sem carga útil, 445 W [F68],
      e o relé UHF Electra em full duplex, pior caso no fim de vida, 65 W [F69]. Não inclui a potência do
      sistema de captura (CU-2), que não tem valor publicado. Usar a carga de pico também no eclipse é conservador.
    status: NÃO VALIDADA
  - id: P-029
    nome: eficiencia_recarga_bateria
    valor: 0.8
    unidade: adimensional (energia devolvida / energia de recarga)
    uso: config/plataformas.yaml — potência do painel do orbitador
    justificativa: >
      Sem fonte primária para Li-ion de espaçonave. O JPL D-101146 cita ~80 % de eficiência energética, mas
      para baterias de alta temperatura (outra química), por isso não é usado como fonte. Valor redondo e conservador.
    status: NÃO VALIDADA
  - id: P-030
    nome: fator_perdas_painel_orbitador
    valor: 0.774
    unidade: adimensional (multiplica a potência específica a 1 UA escalada por 1/d²)
    uso: config/plataformas.yaml — massa do painel do orbitador
    justificativa: >
      Do MRO [F65]: 6000 W perto da Terra e 2000 W em Marte. Se "em Marte" for a distância média (1,5236915 UA [F56]),
      a razão 2000/6000 vale 0,774 do inverso do quadrado (calculado aqui). Cobre temperatura e degradação de forma
      agregada. A fonte não diz a que distâncias valem os dois números.
    status: NÃO VALIDADA
  - id: P-031
    nome: base_do_cabeamento_orbitador
    valor: plataforma
    unidade: —
    uso: config/plataformas.yaml — cabeamento = 5 % da massa seca nominal [F71]
    justificativa: >
      A regra da ESA aplica 5 % sobre a massa seca nominal do veículo inteiro. Aqui a base é só a plataforma: a CU-2
      é uma alocação de carga útil que já traz o seu cabeamento, e o ε dos estágios já inclui o deles. Revista no
      portão da Etapa 2.3: a primeira versão incluía a CU-2 na base, e 37,4 dos 55,2 kg básicos de cabeamento
      vinham dela, recebendo a margem de 75 %.
    status: NÃO VALIDADA
  - id: P-032
    nome: energia_lander
    valor: {energia_por_sol_wh: 3500, fracao_noite: 0.5}
    unidade: Wh/sol; adimensional
    uso: config/plataformas.yaml — painel e bateria do lander
    justificativa: >
      Consumo da plataforma do lander igual à energia gerada pelo Phoenix por sol no início da missão [F76].
      Rendimento do painel pelo do Phoenix (3500 Wh/sol em 4,2 m² [F40]), obtido a ~68° N no verão, com o Sol
      quase sempre acima do horizonte; no sítio deste estudo (18,85°) a noite tem ~metade do sol (fração 0,5).
      Sem poeira, sem tempestade e sem variação sazonal. O aquecimento do MAV e a sua energia ficam no bloco do MAV.
    status: NÃO VALIDADA
  - id: P-033
    nome: margem_crescimento_e1_ponto_medio
    valor: ponto médio da faixa E1 do AIAA S-120A
    unidade: —
    uso: config/plataformas.yaml — margem por subsistema
    justificativa: >
      A norma dá faixas por categoria [F70]; a escolha do ponto dentro da faixa é de projeto. Os extremos da faixa
      e as alternativas da ESA [F71] e do GSFC [F72] aparecem lado a lado nos resultados. A classificação de cada
      subsistema numa categoria (ex.: comunicação como eletrônica de 0–5 kg) também é escolha deste estudo.
    status: NÃO VALIDADA
  - id: P-034
    nome: sistema_de_amostras_lander
    valor: 59
    unidade: kg
    uso: "config/plataformas.yaml — coleta e transferência de amostras na base do lander (L3 + amostras, alocação provisória) e nos limites L1/L2"
    justificativa: >
