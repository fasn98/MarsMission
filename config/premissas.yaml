  - id: P-061
    nome: probabilidade_de_tempestade_global_na_estada
    valor: {probabilidade_por_ano_marciano: 0.25}
    unidade: fração
    uso: tools/energia.py (probabilidade do risco acima de τ = 6)
    justificativa: >
      A probabilidade de cerca de 25 % por ano marciano [F149] vem de 11 tempestades registradas, com observação
      incompleta antes de 1997. Supõe-se que ela valha para a única estação de início (Ls 185° a 315° [F149]) que a estada
      atravessa, sem dependência do ano. Tempestades que começam pouco antes da chegada (Ls 185°, como as de 2001 e 2018)
      ainda estariam em curso na chegada ([F134]: "persist for weeks to months") e contam como exposição. Pedida pelo Fabio
      no portão da Etapa 4.1.
    status: NÃO VALIDADA
  - id: P-062
    nome: data_do_deposito_de_three_forks
    valor: "2023-01-28"
    unidade: data
    uso: config/termico.yaml (tempo das amostras no depósito até a chegada)
    justificativa: >
      A fonte [F172] diz que os tubos foram selados nas campanhas Crater Floor e Delta Front, esta terminada "around
      mid-February 2023", e que um tubo de cada par foi depositado em Three Forks; não dá a data do depósito. Supõe-se o
      depósito completo até 15/02/2023. O tempo no depósito é contado até a chegada da missão de referência; chamá-lo de
      "mínimo" é inferência desta premissa (a coleta é depois da chegada), não da fonte.
      VALOR-BASE MUDADO com aprovação do Fabio no portão da Etapa 4.4 (2026-11-01): de 15/02/2023 para 28/01/2023,
      alinhado à fonte [F99] ("NASA's Perseverance Rover Completes Mars Sample Depot"; "on Jan. 28, 2023, the 690th Martian day").
    status: NÃO VALIDADA
