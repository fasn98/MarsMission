# Ambiente local e do CI (.github/workflows/ci.yml). O conda só fornece o Python; as dependências vêm de
# pyproject.toml (fonte única), instaladas com pip junto com o pacote em modo editável. O Replit instala o mesmo
# pyproject.toml (ver docs/painel.md).
name: marsmission
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.18
  - pip
  - pip:
      - -e .[dev,painel]
