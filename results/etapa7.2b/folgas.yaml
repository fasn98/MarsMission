premissas_propostas:
- id: P-096
  nome: origem_do_step_do_falcon
  texto: A origem do STEP de keep-in do Falcon é o plano da interface de 1575 mm,
    com o eixo x axial.
  evidencia: '[F82] PDF p. 26 define a origem do sistema da carga útil no plano de
    separação; o topo do arquivo, em 446,76 pol, é coerente com o guia. O arquivo
    não declara o sistema, e separação e interface podem não coincidir.'
- id: P-097
  nome: veiculo_sobre_o_plano_da_interface
  texto: A base dos veículos (z = 0 do modelo) fica no plano da interface, sem altura
    de adaptador nem de sistema de separação.
  evidencia: Convenção do modelo desde a Etapa 7.1, sem fonte; a P-091 não trata disso.
    Um adaptador real sobe o veículo, e o envelope afunila com a altura.
planos:
  vulcan: '[F80] Fig. 4.3.1-1, p. 4-8: "LV STA 2596.66 (1575 Interface)"'
  falcon: '[F82] PDF p. 26: "The origin of the payload coordinate system is fixed
    at the center of the separation plane"; o arquivo STEP não declara que usa esse
    sistema (P-096 proposta)'
