envelhecimento_solido:
- '[F263] PDF p. 1: "The test plan includes propellant aging first at high vacuum
  conditions, representative of the Mars transit, followed by an additional year at
  simulated Mars surface conditions."'
- '[F263] PDF p. 2: "The project has also completed the first of three phases of propellant
  aging"'
- '[F263] PDF p. 1: "the flight heritage is limited and outside the environments,
  the MAV must endure"'
- '[F250] PDF p. 2: "concerns exist with long duration aging associated with baseline
  CTPB (cold temperature capable) propellant"'
- '[F248] PDF p. 3: "The SRL is expected to keep the MAV between -40 °C and +40 °C,
  enabling the use of propellant that has already been qualified for that temperature
  range."'
- '[F248] PDF p. 13: "Current qualification minimum temperatures are -50 °C"; PDF
  p. 14: "Data from the analog samples showed cracking at approximately -70 °C"'
tempo_no_msr:
- '[F266] (slides do IAC-19) PDF p. 3: "MAV dwell time in SRL on Mars ~9 months"'
- '[F35] PDF p. 1: "After residing on the surface for another year"'
