- orbitador: MRO
  estado: operando; propelente além de três anos (2025); TWTA de banda X perto do
    fim da vida, ponto único de falha; valores na tabela do FY2027 até o FY2031 (anos
    nocionais)
  fonte: '[F182] pPDF 14 (impr. 12): "There are propellant reserves that will sustain
    spacecraft operations well beyond another three years"; pPDF 74: "The X-Band TWTA
    is nearing its end of life and is a single-string failure point for the communication
    system"; [F146] p. PS-48: "Mars Reconnaissance Orbiter 2005 (MRO) -- -- 26.0 26.0
    26.0 24.0 24.0"'
- orbitador: Odyssey
  estado: propelente baixo; financiamento eliminado no pedido do FY2026; não aparece
    na tabela da PS-48 do FY2027 (observação)
  fonte: '[F182] pPDF 64: "The low mass of usable propellant (3.2 kg) with its high
    uncertainty"; [F126] p. PS-45: "has eliminated funding for several missions operating
    well past the end of prime mission including Mars Odyssey and Mars Express"'
- orbitador: TGO
  estado: saúde nominal "well into the 2030s"; extensão da ESA até 2030 não conferida;
    até 2048 kbps; pelo menos dois passes bons por sol
  fonte: '[F183]: "The TGO spacecraft health is nominal and appears consistent with
    operation well into the 2030s"; [F177] p. 26: "TGO supports adaptive data rates
    up to 2048 kbps, and can therefore return over 1 Gbit during a 15-minute overflight";
    [F184]: "TGO provides at least two good communications opportunities per sol"'
- orbitador: Mars Express
  estado: financiado até o fim de 2026; extensão pedida até o fim de 2029; capacidade
    de relé não quantificada
  fonte: '[F183]: "Mars Express operations are currently funded until end of 2026,
    with extension requested until end of 2029"'
- orbitador: Mars Telecommunications Orbiter (comercial)
  estado: US$ 700 milhões na PL 119-21, entrega até 31/12/2028; contrato e vencedor
    não conferidos
  fonte: '[F185] 139 STAT. 133: "$700,000,000, to be obligated not later than fiscal
    year 2026, for the procurement, using a competitively bid, firm fixed-price contract
    with a United States commercial provider"; "which shall be delivered to the Administration
    not later than December 31, 2028"'
