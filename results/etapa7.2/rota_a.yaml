arranjo_msl:
- item: Ordem axial do MSL
  achado: 'de cima para baixo: estágio de cruzeiro, casca traseira, paraquedas, estágio
    de descida, BUD, rover, escudo'
  fonte: '[F244] Fig. 1, PDF p. 2; [F214] PDF p. 35, vista expandida'
- item: Rover e estágio de descida no aeroshell
  achado: o aeroshell contém os dois
  fonte: '[F244] PDF p. 1: "The 4.5 m aeroshell is composed of a heatshield and backshell,
    and contains the DS and rover."'
- item: Separação do escudo
  achado: sem o escudo, rover e estágio de descida ficam expostos
  fonte: '[F244] PDF p. 2: "the heatshield is jettisoned to expose the both the DS
    and rover"; [F227] PDF p. 6: "exposes the stowed rover and descent stage to free-stream
    conditions"'
- item: Estágio de descida e casca
  achado: o estágio de descida fica aninhado na casca traseira
  fonte: '[F244] PDF p. 9: "with the PDV nested inside the backshell"'
- item: Mars 2020
  achado: '"quase idêntico" ao MSL na viagem, sem cotas nem corte; não prova o arranjo
    interno'
  fonte: '[F45] PDF p. 37: "Perseverance is traveling to Mars in an almost identical
    way to NASA''s Curiosity rover"'
- item: Cotas internas
  achado: 'não achadas: corte, altura da pilha, distância ao ombro, ou se o rover
    entra na parte cônica do escudo'
  fonte: procurado em [F244], [F214], [F45], [F227], [F226], [F215] e [F232]
