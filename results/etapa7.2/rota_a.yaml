  ressalva_vulcan: '[F80] PDF p. 40: "should be used only as a guideline"; a tabela
    não dá capacidade por massa, e há envelope específico por adaptador (PDF p. 38-39:
    "Static payload envelopes specific to each payload adapter and separation system
    are available")'
  ressalva_falcon: '[F82] não publica altura de adaptador. PDF p. 27: "Any payload
    adapters required (e.g., to achieve a 937-mm or 1,194-mm or 1,666-mm (36.89 in.
    or 47.01 or 65.59 in.) interface) must also fit within the keep-in volumes": a
    fonte não pede adaptador para um veículo com a própria interface de 1575 mm, então
    a mesma altura, por análogo, fica do lado seguro. Limite do PAF de 1575 mm: PDF
    p. 28, "up to 10,885 kg"'
  p097_proposta: 'Entre o plano da interface de 1575 mm e a base dos veículos há um
    adaptador com sistema de separação, de altura 0,127 m, e os veículos sobem essa
    altura em relação ao envelope. Fonte da altura: [F80] Tab. 4.2.2-1a. Falcon: sem
    altura publicada, mesma altura por análogo, do lado seguro. A capacidade para
    as massas dos veículos não foi conferida, e os 43 kg do adaptador não estão no
    orçamento.'
  base_proposta: 1575 mm, clampband
