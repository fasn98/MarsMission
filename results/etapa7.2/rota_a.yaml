  achado: '"quase idêntico" ao MSL na viagem, sem cotas nem corte; não prova o arranjo
    interno'
  fonte: '[F45] PDF p. 37: "Perseverance is traveling to Mars in an almost identical
    way to NASA''s Curiosity rover"'
