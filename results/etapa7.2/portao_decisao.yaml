  achado: '"Liquid propulsion vehicle found to not be feasible"'
  fonte: '[F231] PDF p. 3'
- item: Fonte que poderia resolver
  achado: desenho cotado do MAV do MSR, ou o estudo líquido de dois estágios (Trinidad
