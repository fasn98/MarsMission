- item: Motor R-4D-11
  achado: dimensões publicadas; ver a conta acima
  fonte: '[F228] PDF p. 22'
- item: Interestágio
  achado: sem cota; no MSR, o bocal do 2º estágio fica dentro do interestágio ("the
    nested SRM2 nozzle")
