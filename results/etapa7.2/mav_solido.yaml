contra_no_adr_0007:
- item: Massa pela regra (iii)
  adr: 41,3 a 41,4 t do sólido, contra 34,2 a 34,4 t do hipergólico
  hoje: o ADR registra que a comparação não foi refeita com o Isp de voo de 310 s;
    o GLOM do sólido para o nosso Δv está na tabela de cima
- item: Frio extremo
  adr: '[F58] p. 4: "Potential issues with extremely cold environments"'
  hoje: 'o MSR mantém o MAV num recinto térmico: [F249] PDF p. 3: "the MAV is stored
    in a thermal enclosure known as the igloo"; [F35] PDF p. 9: "the vehicle exterior
    will be maintained at -62.5°C by the SRL igloo. Most internal components will
    be kept at a non-operational AFT of -40°C". O grão trincou perto de −70 °C em
    ensaio: [F248] PDF p. 14: "Data from the analog samples showed cracking at approximately
    -70 °C"; PDF p. 13: "Current qualification minimum temperatures are -50 °C". O
    risco segue, com mitigação de projeto, não de voo'
- item: Aquecimento antes do voo
  adr: não tratado no ADR
  hoje: '[F34] PDF p. 5: "between 2 to 12 sols to warm the SRMs to flight temperatures";
    [F249] PDF p. 4: "A solid motor temperature gradient of 10 oC/hr was desirable
    to minimize the risk of this solid motor grain cracking", "peak power ... 288W"'
- item: Estocagem longa
  adr: não tratado no ADR
  hoje: '[F250] PDF p. 2: "concerns exist with long duration aging associated with
    baseline CTPB (cold temperature capable) propellant"'
- item: Não estrangula nem desliga
  adr: '[F58] p. 4: "Cannot be actively throttled or shut down"'
  hoje: 'vale igual: o corte no alvo exige outro meio (o MSR usa costa longa e um
    2º estágio dimensionado para a queima)'
