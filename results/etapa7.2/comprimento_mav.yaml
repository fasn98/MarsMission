fontes_p086:
- item: Comprimento total do MAV do MSR
  achado: limite de 2,99 m com Ø 0,5 m (SRC); 3,0 m com Ø 0,57 m (DAC-0.0); 2,8 m
    com Ø 0,57 m (2019). Nenhuma traz a divisão por elemento
  fonte: '[F35] p. 3; [F236] PDF p. 2; [F238] PDF p. 15'
- item: Divisão por elemento
  achado: não há divisão completa em nenhuma das fontes consultadas; há uma figura
    sem cotas por trecho e cotas soltas, nas linhas abaixo
  fonte: '[F237] PDF p. 4; [F35]; [F236]; [F238]'
- item: Bocal aninhado
  achado: o 2º estágio tem o bocal dentro do interestágio, e isso aparece como risco
    na separação; a fonte não dá o comprimento aninhado
  fonte: '[F35] PDF p. 15: "the small clearances of the interstage hardware and the
    nested SRM2 nozzle"; [F236] PDF p. 13: "clearance of the nested second stage nozzle
    hardware"'
- item: Encurtar bocal e interestágio
  achado: 'o estudo troca Isp por comprimento no 2º estágio: cerca de 10 s a menos,
    num bocal de expansão 81 e Isp 293 s. A Fig. 10 tem o melhor ponto perto de −0,15
    m no bocal, com GLOM cerca de 8 kg menor com o plano de separação na saída do
    bocal e 14 kg menor perto da flange, mas nesta segunda curva quase 12 kg já existem
    sem encurtar o bocal (leitura da figura, NÃO VALIDADO). Motor sólido, com o bocal
    aninhado desenhado no interestágio'
  fonte: '[F238] PDF p. 10: "trading I sp for nozzle length"; "a significantly shorter
    inter-stage and nozzle"; Fig. 10, eixo "Nozzle Length change, m"'
- item: Motor do 1º estágio (MSR de 2019)
  achado: caixa do motor em três níveis de propelente, de 30,5 a 31,7 pol; é cota
    de um elemento, de motor sólido, sem o bocal completo, e não a divisão do veículo
  fonte: '[F238] PDF p. 12, Fig. 11: "525-lb prop, 31.7 inch case"; "475-lb prop,
    30.5 inch case"'
